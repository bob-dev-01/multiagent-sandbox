      def run(task_input, tools):
          sheets = tools.read_spreadsheet(path="shop.xlsx")["sheets"]
          names = {row[0]: row[1] for row in sheets["customers"][1:]}
          stats = {cid: [0, 0.0] for cid in names}
          unmatched = 0
          for _, cid, amount in sheets["orders"][1:]:
              if cid not in stats:
                  unmatched += 1
                  continue
              stats[cid][0] += 1
              stats[cid][1] += amount
          summary = [
              {"name": names[cid], "order_count": count, "spend": round(spend, 2)}
              for cid, (count, spend) in stats.items()
          ]
          summary.sort(key=lambda entry: entry["name"])
          return {"summary": summary, "unmatched_orders": unmatched}

