      import operator


      def run(task_input, tools):
          sheets = tools.read_spreadsheet(path="shop.xlsx")["sheets"]
          customer_rows = sheets["customers"][1:]
          order_rows = sheets["orders"][1:]
          known_ids = {cid for cid, _ in customer_rows}
          summary = []
          for cid, name in customer_rows:
              amounts = [amt for _, oid_cust, amt in order_rows if oid_cust == cid]
              total = 0.0
              for amt in amounts:
                  total += amt
              summary.append({"name": name, "order_count": len(amounts), "spend": round(total, 2)})
          summary.sort(key=operator.itemgetter("name"))
          unmatched = len([1 for _, cust, _ in order_rows if cust not in known_ids])
          return {"summary": summary, "unmatched_orders": unmatched}

