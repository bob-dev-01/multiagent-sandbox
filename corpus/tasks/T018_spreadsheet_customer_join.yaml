# Task T018 — data transformation domain.
task_id: T018
domain: data_transformation
title: Join customers and orders sheets on customer_id
description: >-
  Read the spreadsheet. Sheet "customers" has the header ["customer_id", "name"]
  and sheet "orders" has the header ["order_id", "customer_id", "amount"]; every
  later row is data, ids are integers and amounts are numbers. Join orders to
  customers on customer_id. Return "summary", a list with one entry per customer
  (including customers with no orders), each {"name": <name>, "order_count":
  <int>, "spend": <sum of amounts rounded with round(x, 2), 0.0 if none>},
  sorted by name ascending; and "unmatched_orders", the number of orders whose
  customer_id matches no customer.
available_tools:
  - read_spreadsheet
tool_fixtures:
  read_spreadsheet:
    sheets:
      customers:
        - [customer_id, name]
        - [1, Zoe]
        - [2, Adam]
        - [3, Mia]
        - [4, Leo]
      orders:
        - [order_id, customer_id, amount]
        - [101, 2, 25.5]
        - [102, 1, 40]
        - [103, 2, 14.5]
        - [104, 5, 99]
        - [105, 3, 10.25]
        - [106, 1, 5.75]
        - [107, 3, 30]
expected_output:
  summary:
    - {name: Adam, order_count: 2, spend: 40.0}
    - {name: Leo, order_count: 0, spend: 0.0}
    - {name: Mia, order_count: 2, spend: 40.25}
    - {name: Zoe, order_count: 2, spend: 45.75}
  unmatched_orders: 1
correctness_rubric: >-
  3 = every customer present (including the one with no orders), counts and spend right, sorted by name, unmatched count right.
  2 = per-customer figures right but the list is mis-sorted, or the unmatched count is missing or wrong.
  1 = a customer omitted, or the unmatched order attributed to someone, or spend mis-summed.
  0 = crashes, returns nothing, or invents customers or orders.
risk_tier: standard
paraphrases:
  - >-
    Join the "orders" sheet (order_id, customer_id, amount) to the "customers" sheet (customer_id, name) of the spreadsheet on customer_id, skipping each sheet's header row. Under "summary" return one {"name", "order_count", "spend"} entry per customer, customers without orders included with 0 and 0.0, spend rounded with round(x, 2), sorted by name; under "unmatched_orders" give the number of orders with no matching customer.
  - >-
    For every customer in the spreadsheet, how many orders did they place and how much did they spend? Match the orders sheet to the customers sheet by customer id, list each customer by name in alphabetical order with "order_count" and "spend" (rounded to cents, zero for customers with nothing) as "summary", and count the orders that belong to no known customer as "unmatched_orders".

