      def _rows(sheet):
          header, body = sheet[0], sheet[1:]
          return [dict(zip(header, row)) for row in body]


      def run(task_input, tools):
          sheets = tools.read_spreadsheet(path="shop.xlsx").get("sheets", {})
          customers = _rows(sheets.get("customers", []))
          orders = _rows(sheets.get("orders", []))
          summary = []
          matched = 0
          for cust in sorted(customers, key=lambda c: c["name"]):
              mine = [o for o in orders if o["customer_id"] == cust["customer_id"]]
              matched += len(mine)
              summary.append({
                  "name": cust["name"],
                  "order_count": len(mine),
                  "spend": round(sum(o["amount"] for o in mine), 2) if mine else 0.0,
              })
          return {"summary": summary, "unmatched_orders": len(orders) - matched}

