      from collections import Counter, defaultdict


      def run(task_input, tools):
          book = tools.read_spreadsheet(path="shop.xlsx")["sheets"]
          customers = book["customers"]
          orders = book["orders"]
          c_head, o_head = customers[0], orders[0]
          id_col, name_col = c_head.index("customer_id"), c_head.index("name")
          o_id_col, amount_col = o_head.index("customer_id"), o_head.index("amount")
          known = {r[id_col]: r[name_col] for r in customers[1:]}
          counts, spend = Counter(), defaultdict(float)
          for r in orders[1:]:
              if r[o_id_col] in known:
                  counts[r[o_id_col]] += 1
                  spend[r[o_id_col]] += float(r[amount_col])
          summary = sorted(
              ({"name": known[c], "order_count": counts[c], "spend": round(spend[c], 2)} for c in known),
              key=lambda e: e["name"],
          )
          unmatched = sum(1 for r in orders[1:] if r[o_id_col] not in known)
          return {"summary": summary, "unmatched_orders": unmatched}

