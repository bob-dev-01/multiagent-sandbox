      from decimal import Decimal


      def run(task_input, tools):
          sheets = tools.read_spreadsheet(path="shop.xlsx")["sheets"]
          by_id = {}
          for customer_id, name in sheets["customers"][1:]:
              by_id[customer_id] = {"name": name, "order_count": 0, "spend": Decimal("0")}
          unmatched_orders = 0
          for row in sheets["orders"][1:]:
              entry = by_id.get(row[1])
              if entry is None:
                  unmatched_orders += 1
              else:
                  entry["order_count"] += 1
                  entry["spend"] += Decimal(str(row[2]))
          summary = []
          for name in sorted(e["name"] for e in by_id.values()):
              entry = next(e for e in by_id.values() if e["name"] == name)
              summary.append({**entry, "spend": round(float(entry["spend"]), 2)})
          return {"summary": summary, "unmatched_orders": unmatched_orders}

