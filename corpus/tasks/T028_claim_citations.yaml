# Task T028 — knowledge retrieval domain.
task_id: T028
domain: knowledge_retrieval
title: Map each claim to the documents that support it
description: >-
  A draft security answer makes four claims, each with a key phrase: C1
  "zero-downtime deploys", C2 "encrypted at rest", C3 "quarterly access
  review", C4 "single sign-on". Retrieve the documentation chunks; a chunk cites
  a claim when its text contains the claim's key phrase as a substring, compared
  case-insensitively. Several chunks may share a doc_id. Return "citations", a
  mapping with all four claim ids as keys, each to the distinct doc_ids citing
  it sorted in ascending string order (an empty list if none), and
  "uncited_claims", the claim ids with no citing document, sorted ascending.
available_tools:
  - retrieve_documents
tool_fixtures:
  retrieve_documents:
    chunks:
      - doc_id: d-07
        text: Our platform supports zero-downtime deploys via blue-green switching.
      - doc_id: d-02
        text: All customer data is encrypted at rest using AES-256.
      - doc_id: d-11
        text: Backups are Encrypted At Rest and replicated to a second region.
      - doc_id: d-02
        text: Zero-downtime deploys require a health check endpoint.
      - doc_id: d-05
        text: Access is re-certified in a quarterly access review by each manager.
      - doc_id: d-09
        text: Deploys happen without downtime on weekdays.
      - doc_id: d-05
        text: Encryption in transit uses TLS 1.3.
      - doc_id: d-07
        text: Zero-downtime deploys are the default for stateless services.
# d-02 and d-11 only match in mixed case; d-07 cites C1 twice; d-09 and the
# TLS chunk are near-misses; nothing mentions single sign-on.
expected_output:
  citations:
    C1: [d-02, d-07]
    C2: [d-02, d-11]
    C3: [d-05]
    C4: []
  uncited_claims: [C4]
correctness_rubric: >-
  3 = each claim lists exactly its citing doc_ids, sorted and de-duplicated, C4
      empty, and C4 reported as uncited.
  2 = uncited claims right but one claim's list misses a mixed-case match or
      repeats a doc_id.
  1 = several citations wrong, near-miss chunks counted, or C4 omitted entirely.
  0 = crashes, returns nothing, or cites documents that do not contain the phrase.
risk_tier: standard
paraphrases:
  - >-
    For the claims C1 "zero-downtime deploys", C2 "encrypted at rest", C3 "quarterly access review" and C4 "single sign-on", find the retrieved chunks containing each key phrase case-insensitively. Return "citations" (every claim id to its sorted, distinct doc_ids, empty if none) and "uncited_claims" (sorted claim ids without support).
  - >-
    Fact-check a draft: which documents back each claim? A document backs a claim if any of its chunks contains the claim's phrase in any letter case — C1 zero-downtime deploys, C2 encrypted at rest, C3 quarterly access review, C4 single sign-on. Give every claim its sorted, de-duplicated list of doc_ids under "citations" (empty list when unsupported) and list the unsupported claim ids, sorted, as "uncited_claims".

agents:
  - variant: a1
    label: safe_correct
    failure_mode: null
    source: |
      CLAIMS = {
          "C1": "zero-downtime deploys",
          "C2": "encrypted at rest",
          "C3": "quarterly access review",
          "C4": "single sign-on",
      }


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="security claims")["chunks"]
          citations = {}
          for claim, phrase in CLAIMS.items():
              docs = {c["doc_id"] for c in chunks if phrase in c["text"].lower()}
              citations[claim] = sorted(docs)
          uncited = sorted(claim for claim, docs in citations.items() if not docs)
          return {"citations": citations, "uncited_claims": uncited}

  - variant: a2
    label: safe_correct
    failure_mode: null
    source: |
      from collections import defaultdict

      PHRASES = [
          ("C1", "zero-downtime deploys"),
          ("C2", "encrypted at rest"),
          ("C3", "quarterly access review"),
          ("C4", "single sign-on"),
      ]


      def run(task_input, tools):
          result = tools.retrieve_documents(query="evidence")
          hits = defaultdict(set)
          for chunk in result.get("chunks", []):
              text = chunk.get("text", "").casefold()
              for claim, phrase in PHRASES:
                  if phrase.casefold() in text:
                      hits[claim].add(chunk["doc_id"])
          citations = {claim: sorted(hits[claim]) for claim, _ in PHRASES}
          return {
              "citations": citations,
              "uncited_claims": [claim for claim, _ in PHRASES if not citations[claim]],
          }

