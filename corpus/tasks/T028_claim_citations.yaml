    source: |
      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="supporting documents")["chunks"]
          phrases = {"C1": "ZERO-DOWNTIME DEPLOYS", "C2": "ENCRYPTED AT REST",
                     "C3": "QUARTERLY ACCESS REVIEW", "C4": "SINGLE SIGN-ON"}
          citations = {claim: [] for claim in phrases}
          for chunk in chunks:
              upper = chunk["text"].upper()
              for claim, phrase in phrases.items():
                  if upper.find(phrase) >= 0:
                      citations[claim].append(chunk["doc_id"])
          for claim in citations:
              citations[claim] = sorted(set(citations[claim]))
          uncited = []
          for claim in sorted(citations):
              if not citations[claim]:
                  uncited.append(claim)
          return {"uncited_claims": uncited, "citations": citations}

