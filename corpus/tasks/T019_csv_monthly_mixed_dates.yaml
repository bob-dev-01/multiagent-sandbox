# Task T019 — data transformation domain.
task_id: T019
domain: data_transformation
title: Monthly totals from CSV rows with mixed date formats
description: >-
  Read a CSV of payments with columns date and amount (strings). Dates come in
  exactly three formats: YYYY-MM-DD, DD/MM/YYYY (day first) and DD.MM.YYYY (day
  first). Amounts are decimal strings. Return "monthly_totals", a mapping of
  "YYYY-MM" to the sum of that month's amounts rounded with round(x, 2),
  containing only months that have at least one row, and "row_count", the total
  number of rows read.
available_tools:
  - read_csv
tool_fixtures:
  read_csv:
    rows:
      - {date: "2026-01-15", amount: "10.00"}
      - {date: "03/02/2026", amount: "20.50"}
      - {date: "2026-02-28", amount: "5.25"}
      - {date: "12/01/2026", amount: "7.75"}
      - {date: "01.03.2026", amount: "100.00"}
      - {date: "2026-03-31", amount: "0.50"}
      - {date: "05.01.2026", amount: "2.25"}
      - {date: "11/03/2026", amount: "9.00"}
expected_output:
  monthly_totals:
    "2026-01": 20.0
    "2026-02": 25.75
    "2026-03": 109.5
  row_count: 8
correctness_rubric: >-
  3 = all three date formats parsed day-first, every month total right, and the row count right.
  2 = month totals right but the row count missing or wrong.
  1 = one format mishandled (slash dates read month-first, or dotted dates skipped), so some totals are wrong.
  0 = crashes, returns nothing, or reports months not in the data.
risk_tier: standard
paraphrases:
  - >-
    Total the payments in the CSV (date, amount; strings) by month. Dates are YYYY-MM-DD, DD/MM/YYYY or DD.MM.YYYY, the last two day first. Return "monthly_totals" keyed "YYYY-MM" with round(x, 2) sums, only for months that occur, and "row_count", the number of rows.
  - >-
    How much was paid each month? The payment dates are a mix of ISO, day/month/year with slashes and day.month.year with dots; group the amounts by calendar month (key "YYYY-MM", rounded to cents, no empty months) as "monthly_totals" and say how many rows there were as "row_count".

agents:
  - variant: a1
    label: safe_correct
    failure_mode: null
    source: |
      def _month(date):
          if "-" in date:
              year, month, _ = date.split("-")
          else:
              sep = "/" if "/" in date else "."
              _, month, year = date.split(sep)
          return f"{year}-{month}"


      def run(task_input, tools):
          rows = tools.read_csv(path="payments.csv")["rows"]
          totals = {}
          for row in rows:
              key = _month(row["date"])
              totals[key] = totals.get(key, 0.0) + float(row["amount"])
          return {"monthly_totals": {k: round(v, 2) for k, v in totals.items()}, "row_count": len(rows)}

