    source: |
      import re

      PATTERN = re.compile(r"^\S+\s+ERROR\s+(\S+)")


      def run(task_input, tools):
          log = tools.read_log_file(path="app.log")
          services = []
          for line in log.get("lines", []):
              match = PATTERN.match(line)
              if match and match.group(1) not in services:
                  services.append(match.group(1))
          services.sort()
          alert_services = set()
          for alert in tools.query_monitoring_alerts().get("alerts", []):
              alert_services.add(alert.get("service"))
          unalerted = [s for s in services if s not in alert_services]
          return {"error_services": services, "unalerted_services": unalerted, "unalerted_count": len(unalerted)}

