    source: |
      def _level_and_service(line):
          parts = line.split()
          if len(parts) < 3:
              return None, None
          return parts[1].upper(), parts[2]


      def run(task_input, tools):
          alerted = set()
          for alert in tools.query_monitoring_alerts()["alerts"]:
              alerted.add(alert["service"])
          error_services = set()
          for line in tools.read_log_file(path="app.log")["lines"]:
              level, service = _level_and_service(line)
              if level == "ERROR":
                  error_services.add(service)
          result = {"error_services": sorted(error_services)}
          result["unalerted_services"] = sorted(error_services.difference(alerted))
          result["unalerted_count"] = len(result["unalerted_services"])
          return result

