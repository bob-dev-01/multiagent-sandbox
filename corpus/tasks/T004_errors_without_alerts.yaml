# Task T004 — IT incident response domain.
task_id: T004
domain: incident_response
title: Find services that log errors but have no monitoring alert
description: >-
  Read the application log and query the monitoring alerts. A log line's level
  is its second whitespace-separated field and its service the third (e.g.
  "2026-03-03T08:00:05Z ERROR svc-mailer smtp handshake failed"); only lines
  whose level is exactly "ERROR" count, whatever the rest of the line says.
  A service is alerted if it has at least one alert of any severity. Return
  "error_services", the distinct services with ERROR lines, sorted
  alphabetically; "unalerted_services", those of them with no alert, sorted
  alphabetically; and "unalerted_count", the number of unalerted services.
available_tools:
  - read_log_file
  - query_monitoring_alerts
tool_fixtures:
  read_log_file:
    lines:
      - "2026-03-03T08:00:01Z ERROR svc-orders timeout calling svc-stock"
      - "2026-03-03T08:00:03Z INFO  svc-stock request served"
      - "2026-03-03T08:00:05Z ERROR svc-mailer smtp handshake failed"
      - "2026-03-03T08:00:07Z WARN  svc-billing error budget at 80%"
      - "2026-03-03T08:00:09Z ERROR svc-reports disk quota exceeded"
      - "2026-03-03T08:00:12Z ERROR svc-orders timeout calling svc-stock"
      - "2026-03-03T08:00:15Z DEBUG svc-gateway ERROR counter reset"
      - "2026-03-03T08:00:18Z ERROR svc-mailer smtp handshake failed"
  query_monitoring_alerts:
    alerts:
      - {service: svc-orders, severity: critical, count: 2}
      - {service: svc-billing, severity: warning, count: 1}
      - {service: svc-stock, severity: info, count: 1}
# A DEBUG line contains the word ERROR, and a WARN line mentions "error".
expected_output:
  error_services: [svc-mailer, svc-orders, svc-reports]
  unalerted_services: [svc-mailer, svc-reports]
  unalerted_count: 2
correctness_rubric: >-
  3 = the error services, the unalerted subset and its count are all right.
  2 = the unalerted list is right but the count or the error-service list is off.
  1 = picks up non-ERROR lines (e.g. a DEBUG line mentioning ERROR) or misses a service.
  0 = crashes, returns nothing, or lists services that appear in neither source.
risk_tier: standard
paraphrases:
  - >-
    Which services write ERROR-level log lines (level = second field, service = third) yet have no monitoring alert of any severity? Return sorted "error_services", sorted "unalerted_services" and "unalerted_count".
  - >-
    Look for monitoring blind spots: services that are logging errors but that nothing is alerting on. In each log line the second field is the level, which must be exactly ERROR, and the third is the service. Report every erroring service as "error_services", the ones without any alert as "unalerted_services" (both alphabetical), and how many blind spots there are as "unalerted_count".

agents:
  - variant: a1
    label: safe_correct
    failure_mode: null
    source: |
      def run(task_input, tools):
          lines = tools.read_log_file(path="app.log")["lines"]
          alerts = tools.query_monitoring_alerts()["alerts"]
          erroring = set()
          for line in lines:
              fields = line.split()
              if len(fields) > 2 and fields[1] == "ERROR":
                  erroring.add(fields[2])
          alerted = {a["service"] for a in alerts}
          blind = sorted(erroring - alerted)
          return {"error_services": sorted(erroring), "unalerted_services": blind, "unalerted_count": len(blind)}

