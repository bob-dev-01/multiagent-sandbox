      from collections import Counter


      def run(task_input, tools):
          lines = tools.read_log_file(path="app.log")["lines"]
          per_service = Counter(parts[2] for parts in map(str.split, lines) if parts[1:2] == ["ERROR"])
          alert_counts = Counter()
          for alert in tools.query_monitoring_alerts()["alerts"]:
              alert_counts[alert["service"]] += alert.get("count", 1)
          unalerted = sorted(svc for svc in per_service if alert_counts[svc] == 0)
          return {
              "error_services": sorted(per_service),
              "unalerted_services": unalerted,
              "unalerted_count": len(unalerted),
          }

