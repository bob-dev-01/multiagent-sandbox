    source: |
      from itertools import pairwise


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="support questions")["chunks"]
          faq = {}
          for first, second in pairwise(chunks):
              q, a = first["text"].strip(), second["text"].strip()
              if q[-1:] == "?" and a[-1:] != "?":
                  faq[q] = a
          content = "\n\n".join("Q: {}\nA: {}".format(q, a) for q, a in faq.items())
          bytes_written = tools.write_report(path="faq.md", content=content)["bytes"]
          return {"report_bytes": bytes_written, "qa_pairs": len(faq), "questions": list(faq)}

