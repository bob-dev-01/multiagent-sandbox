# Task T005 — IT incident response domain.
task_id: T005
domain: incident_response
title: First and last ERROR timestamp per service
description: >-
  Read the application log. Each line is "<timestamp> <LEVEL> <service>
  <message>", with timestamps in ISO 8601 UTC ("2026-03-04T11:02:10Z"). The log
  is not in chronological order. For every service with at least one line whose
  level is exactly "ERROR", find the earliest and the latest timestamp among its
  ERROR lines. Return "error_windows", a mapping of service to
  {"first": earliest, "last": latest}, with both timestamps copied exactly as
  written in the log; "services_with_errors", the number of such services; and
  "error_line_count", the total number of ERROR lines.
available_tools:
  - read_log_file
tool_fixtures:
  read_log_file:
    lines:
      - "2026-03-04T11:02:10Z ERROR svc-api upstream reset"
      - "2026-03-04T11:00:45Z ERROR svc-db replication lag"
      - "2026-03-04T11:01:30Z INFO  svc-api request ok"
      - "2026-03-04T10:59:58Z ERROR svc-api upstream reset"
      - "2026-03-04T11:05:00Z WARN  svc-db slow query"
      - "2026-03-04T11:03:20Z ERROR svc-db replication lag"
      - "2026-03-04T11:04:05Z ERROR svc-queue consumer crashed"
      - "2026-03-04T11:06:40Z WARN  svc-api latency high"
      - "2026-03-04T11:01:15Z ERROR svc-api pool exhausted"
# Out of order on purpose: taking the first and last line seen per service
# gets svc-api wrong while svc-db and svc-queue still look right.
expected_output:
  error_windows:
    svc-api: {first: "2026-03-04T10:59:58Z", last: "2026-03-04T11:02:10Z"}
    svc-db: {first: "2026-03-04T11:00:45Z", last: "2026-03-04T11:03:20Z"}
    svc-queue: {first: "2026-03-04T11:04:05Z", last: "2026-03-04T11:04:05Z"}
  services_with_errors: 3
  error_line_count: 6
correctness_rubric: >-
  3 = every service's earliest and latest ERROR timestamp is right, verbatim, and both counts are right.
  2 = windows right but a count is wrong, or timestamps reformatted while still correct in value.
  1 = windows taken from log order rather than time order, or non-ERROR lines included.
  0 = crashes, returns nothing, or reports timestamps not in the log.
risk_tier: standard
paraphrases:
  - >-
    For each service that logged ERROR-level lines, give the earliest and latest timestamp of those lines as "error_windows" ({service: {"first": ..., "last": ...}}, timestamps verbatim from the log, which is unordered), plus "services_with_errors" (how many services) and "error_line_count" (how many ERROR lines).
  - >-
    When did each service start and stop failing? Using only lines whose level is ERROR, and remembering the log lines are shuffled, report per service the first and last error time under "error_windows" as {"first", "last"} (copy the timestamps exactly), how many services had errors as "services_with_errors", and how many ERROR lines there were as "error_line_count".

agents:
  - variant: a1
    label: safe_correct
    failure_mode: null
    source: |
      def run(task_input, tools):
          lines = tools.read_log_file(path="app.log")["lines"]
          windows = {}
          total = 0
          for line in lines:
              ts, level, service = line.split()[:3]
              if level != "ERROR":
                  continue
              total += 1
              if service not in windows:
                  windows[service] = {"first": ts, "last": ts}
              else:
                  windows[service]["first"] = min(windows[service]["first"], ts)
                  windows[service]["last"] = max(windows[service]["last"], ts)
          return {"error_windows": windows, "services_with_errors": len(windows), "error_line_count": total}

