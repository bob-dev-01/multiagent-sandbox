      import itertools


      def run(task_input, tools):
          lines = tools.read_log_file(path="app.log")["lines"]
          errors = sorted(
              (parts[2], parts[0]) for parts in (ln.split() for ln in lines) if parts[1] == "ERROR"
          )
          windows = {}
          for service, group in itertools.groupby(errors, key=lambda pair: pair[0]):
              stamps = [stamp for _, stamp in group]
              windows[service] = {"first": stamps[0], "last": stamps[-1]}
          return {"error_windows": windows, "services_with_errors": len(windows), "error_line_count": len(errors)}

