      from collections import defaultdict


      def run(task_input, tools):
          stamps = defaultdict(list)
          for line in tools.read_log_file(path="app.log")["lines"]:
              parts = line.split()
              if parts[1] == "ERROR":
                  stamps[parts[2]].append(parts[0])
          windows = {svc: {"first": min(ts), "last": max(ts)} for svc, ts in stamps.items()}
          return {
              "error_windows": windows,
              "services_with_errors": len(windows),
              "error_line_count": sum(len(ts) for ts in stamps.values()),
          }

