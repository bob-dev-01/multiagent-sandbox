      import itertools


      def run(task_input, tools):
          lines = tools.read_log_file(path="app.log")["lines"]
          messages = sorted(" ".join(p[3:]) for p in (ln.split() for ln in lines) if p[1] == "ERROR")
          groups = [(text, len(list(items))) for text, items in itertools.groupby(messages)]
          highest = max(n for _, n in groups)
          top = next(text for text, n in groups if n == highest)
          return {"top_message": top, "occurrences": highest, "distinct_messages": len(groups)}

