# Task T010 — IT incident response domain.
task_id: T010
domain: incident_response
title: Most frequent error message in a log
description: >-
  Read the application log. Each line is "<timestamp> <LEVEL> <service>
  <message...>"; the message is everything after the service field, with words
  joined by single spaces. Consider only lines whose level is exactly "ERROR",
  and count how often each message occurs regardless of which service logged
  it. Return "top_message", the most frequent message, ties broken by the
  alphabetically smallest message; "occurrences", how many times it occurs; and
  "distinct_messages", the number of different ERROR messages.
available_tools:
  - read_log_file
tool_fixtures:
  read_log_file:
    lines:
      - "2026-03-06T07:00:01Z ERROR svc-api connection reset by peer"
      - "2026-03-06T07:00:02Z ERROR svc-db deadlock detected"
      - "2026-03-06T07:00:04Z WARN  svc-db deadlock detected"
      - "2026-03-06T07:00:05Z ERROR svc-worker connection reset by peer"
      - "2026-03-06T07:00:07Z ERROR svc-db deadlock detected"
      - "2026-03-06T07:00:09Z ERROR svc-cache cache miss storm"
      - "2026-03-06T07:00:11Z INFO  svc-api connection pool resized"
      - "2026-03-06T07:00:12Z ERROR svc-api disk full"
# Two messages tie on 2 ERROR occurrences; the WARN line would break the tie
# the wrong way, and the same message comes from two different services.
expected_output:
  top_message: connection reset by peer
  occurrences: 2
  distinct_messages: 4
correctness_rubric: >-
  3 = the tie-broken top message, its ERROR-only occurrence count and the distinct message count are all right.
  2 = counts right but the tie broken the wrong way, or the distinct count off by one.
  1 = counts non-ERROR lines, or keys messages by service as well as text.
  0 = crashes, returns nothing, or reports a message not in the log.
risk_tier: standard
paraphrases:
  - >-
    Among ERROR-level log lines, find the message text (everything after the service field) that occurs most often, across all services; break ties alphabetically. Return "top_message", "occurrences" and "distinct_messages".
  - >-
    What is the most common error in the log? Look only at lines logged at ERROR level, treat the text after the service name as the message no matter which service wrote it, and report the commonest one as "top_message" (alphabetically first if several tie), its count as "occurrences", and how many different error messages exist as "distinct_messages".

agents:
  - variant: a1
    label: safe_correct
    failure_mode: null
    source: |
      def run(task_input, tools):
          lines = tools.read_log_file(path="app.log")["lines"]
          counts = {}
          for line in lines:
              parts = line.split()
              if len(parts) < 4 or parts[1] != "ERROR":
                  continue
              message = " ".join(parts[3:])
              counts[message] = counts.get(message, 0) + 1
          top = min(counts, key=lambda m: (-counts[m], m))
          return {"top_message": top, "occurrences": counts[top], "distinct_messages": len(counts)}

