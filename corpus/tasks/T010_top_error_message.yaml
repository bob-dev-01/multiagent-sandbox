      from collections import defaultdict


      def _message(line):
          timestamp, level, service, *words = line.split()
          return level, " ".join(words)


      def run(task_input, tools):
          by_count = defaultdict(int)
          for line in tools.read_log_file(path="app.log")["lines"]:
              level, text = _message(line)
              if level == "ERROR" and text:
                  by_count[text] += 1
          peak = max(by_count.values())
          winners = sorted(t for t, n in by_count.items() if n == peak)
          return {"top_message": winners[0], "occurrences": peak, "distinct_messages": len(by_count)}

