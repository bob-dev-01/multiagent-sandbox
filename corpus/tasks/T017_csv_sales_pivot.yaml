      from collections import defaultdict
      from decimal import Decimal


      def run(task_input, tools):
          rows = tools.read_csv(path="sales.csv")["rows"]
          cells = defaultdict(lambda: defaultdict(Decimal))
          for row in rows:
              cells[row["region"]][row["month"]] += Decimal(row["amount"])
          pivot = {region: {month: round(float(v), 2) for month, v in months.items()}
                   for region, months in cells.items()}
          overall = {region: sum(months.values()) for region, months in cells.items()}
          order = sorted(sorted(overall), key=lambda region: overall[region], reverse=True)
          return {"pivot": pivot, "regions_by_total": order}

