    source: |
      import itertools


      def run(task_input, tools):
          rows = sorted(tools.read_csv(path="sales.csv")["rows"],
                        key=lambda r: (r["region"], r["month"]))
          pivot = {}
          grand = {}
          for region, region_rows in itertools.groupby(rows, key=lambda r: r["region"]):
              region_rows = list(region_rows)
              pivot[region] = {}
              for month, month_rows in itertools.groupby(region_rows, key=lambda r: r["month"]):
                  pivot[region][month] = round(sum(float(r["amount"]) for r in month_rows), 2)
              grand[region] = round(sum(pivot[region].values()), 2)
          best_first = sorted(grand, key=lambda name: (-grand[name], name))
          return {"pivot": pivot, "regions_by_total": best_first}

