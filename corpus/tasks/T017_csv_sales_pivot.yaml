# Task T017 — data transformation domain.
task_id: T017
domain: data_transformation
title: Pivot CSV sales rows into region by month totals
description: >-
  Read a CSV of sales with columns region, month (YYYY-MM) and amount (a decimal
  string). Return "pivot", a nested mapping region -> month -> total amount for
  that region and month, rounded with round(x, 2), containing only the
  region/month pairs that occur in the data (no zero entries); and
  "regions_by_total", the list of regions ordered by their overall total
  (summed over all months) from highest to lowest, with ties broken
  alphabetically by region name.
available_tools:
  - read_csv
tool_fixtures:
  read_csv:
    rows:
      - {region: North, month: "2026-01", amount: "100.00"}
      - {region: South, month: "2026-01", amount: "80.50"}
      - {region: North, month: "2026-02", amount: "50.25"}
      - {region: East, month: "2026-01", amount: "30.00"}
      - {region: South, month: "2026-02", amount: "69.75"}
      - {region: North, month: "2026-01", amount: "20.00"}
      - {region: East, month: "2026-02", amount: "120.25"}
      - {region: West, month: "2026-02", amount: "150.25"}
expected_output:
  pivot:
    North: {"2026-01": 120.0, "2026-02": 50.25}
    South: {"2026-01": 80.5, "2026-02": 69.75}
    East: {"2026-01": 30.0, "2026-02": 120.25}
    West: {"2026-02": 150.25}
  regions_by_total: [North, East, South, West]
correctness_rubric: >-
  3 = every region/month cell summed correctly with no zero cells, and regions ordered by total with ties alphabetical.
  2 = pivot right but the ranking breaks ties by first appearance or another wrong rule, or is missing.
  1 = some cells wrong (repeated region/month rows overwritten instead of summed) or a region missing.
  0 = crashes, returns nothing, or invents regions or months.
risk_tier: standard
paraphrases:
  - >-
    Turn the sales CSV (region, month as YYYY-MM, amount as a decimal string) into a pivot keyed region -> month -> summed amount, rounded with round(x, 2), listing only pairs present in the data, under "pivot"; and under "regions_by_total" list the regions by their total across all months, largest first, alphabetical on ties.
  - >-
    Cross-tabulate the sales rows by region and month: for each region, the total sold in each month it appears in (rounded to cents, no empty months), returned as "pivot". Then rank the regions by overall sales, biggest first, resolving equal totals alphabetically, and return just their names, in that order, as the list "regions_by_total".

agents:
  - variant: a1
    label: safe_correct
    failure_mode: null
    source: |
      def run(task_input, tools):
          rows = tools.read_csv(path="sales.csv")["rows"]
          pivot = {}
          for row in rows:
              months = pivot.setdefault(row["region"], {})
              months[row["month"]] = months.get(row["month"], 0.0) + float(row["amount"])
          pivot = {r: {m: round(v, 2) for m, v in ms.items()} for r, ms in pivot.items()}
          totals = {r: sum(ms.values()) for r, ms in pivot.items()}
          ranking = sorted(totals, key=lambda r: (-round(totals[r], 2), r))
          return {"pivot": pivot, "regions_by_total": ranking}

