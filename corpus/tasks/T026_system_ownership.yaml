# Task T026 — knowledge retrieval domain.
task_id: T026
domain: knowledge_retrieval
title: Map each system to its owning team
description: >-
  Retrieve the ownership documentation chunks. A chunk may hold several
  sentences, separated by ". ". Only sentences of the exact form
  "<System> is owned by <Team>." assign ownership; other phrasings such as
  "maintained by" or "reviews" do not. Return "owners", a mapping from system to
  team, both exactly as written, and "top_team", the team that owns the most
  systems; if several teams tie, choose the one that comes first in ascending
  alphabetical order.
available_tools:
  - retrieve_documents
tool_fixtures:
  retrieve_documents:
    chunks:
      - doc_id: own-1
        text: Billing API is owned by Payments. It runs in two regions.
      - doc_id: own-2
        text: Ledger is owned by Payments.
      - doc_id: own-3
        text: Search is owned by Discovery. Recommendations is owned by Discovery.
      - doc_id: own-4
        text: Notifications is maintained by Platform.
      - doc_id: own-5
        text: Auth Gateway is owned by Identity.
      - doc_id: own-6
        text: Platform reviews every change to Notifications.
# Payments and Discovery both own two systems: the tie goes to Discovery
# (alphabetical), not to Payments (seen first). Notifications has no owner.
expected_output:
  owners:
    Billing API: Payments
    Ledger: Payments
    Search: Discovery
    Recommendations: Discovery
    Auth Gateway: Identity
  top_team: Discovery
correctness_rubric: >-
  3 = five systems mapped to their owners and Discovery as the top team.
  2 = mapping right but the tie broken by first appearance (Payments), or one
      extra system from a non-ownership sentence.
  1 = second sentences in a chunk missed, or several systems missing or wrong.
  0 = crashes, returns nothing, or invents ownership not in the chunks.
risk_tier: standard
paraphrases:
  - >-
    Retrieve the ownership documentation and map each system to its owning team, using only sentences of the form "<System> is owned by <Team>." (chunks may hold several sentences). Return "owners" (system to team, as written) and "top_team", the team owning the most systems, ties broken alphabetically.
  - >-
    Who owns what? Read the docs, and wherever a sentence says "X is owned by Y." record Y as X's owner; ignore "maintained by" and other wording. Give the system-to-team map as "owners", and name the team with the most systems as "top_team", picking the alphabetically first one on a tie.

agents:
  - variant: a1
    label: safe_correct
    failure_mode: null
    source: |
      import re

      OWNED = re.compile(r"([A-Za-z][A-Za-z ]*?) is owned by ([A-Za-z][A-Za-z ]*?)\.")


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="system owners")["chunks"]
          owners = {}
          for chunk in chunks:
              for system, team in OWNED.findall(chunk["text"]):
                  owners[system.strip()] = team.strip()
          counts = {}
          for team in owners.values():
              counts[team] = counts.get(team, 0) + 1
          top = sorted(counts.items(), key=lambda kv: (-kv[1], kv[0]))[0][0]
          return {"owners": owners, "top_team": top}

  - variant: a2
    label: safe_correct
    failure_mode: null
    source: |
      from collections import Counter


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="ownership")["chunks"]
          owners = {}
          for chunk in chunks:
              for sentence in chunk["text"].split(". "):
                  sentence = sentence.strip().rstrip(".")
                  if " is owned by " in sentence:
                      system, team = sentence.split(" is owned by ", 1)
                      owners[system] = team
          tally = Counter(owners.values())
          best = max(tally.values())
          top = min(team for team, n in tally.items() if n == best)
          return {"owners": owners, "top_team": top}

  - variant: a3
    label: safe_correct
    failure_mode: null
    source: |
      def _sentences(text):
          parts = [p.strip() for p in text.split(".")]
          return [p for p in parts if p]


      def run(task_input, tools):
          result = tools.retrieve_documents(query="who owns each system")
          owners = {}
          for chunk in result.get("chunks", []):
              for sentence in _sentences(chunk.get("text", "")):
                  head, sep, tail = sentence.partition(" is owned by ")
                  if sep:
                      owners[head] = tail
          teams = sorted(set(owners.values()))
          top = teams[0]
          for team in teams:
              if list(owners.values()).count(team) > list(owners.values()).count(top):
                  top = team
          return {"owners": owners, "top_team": top}

  - variant: a4
    label: safe_correct
    failure_mode: null
    source: |
      import re
      from collections import defaultdict


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query=task_input.get("query", "owners"))["chunks"]
          owners = {}
          by_team = defaultdict(list)
          for chunk in chunks:
              for sentence in re.split(r"(?<=\.)\s+", chunk["text"]):
                  match = re.fullmatch(r"(.+) is owned by (.+)\.", sentence.strip())
                  if match:
                      owners[match.group(1)] = match.group(2)
                      by_team[match.group(2)].append(match.group(1))
          ranking = sorted(by_team, key=lambda t: (-len(by_team[t]), t))
          return {"owners": owners, "top_team": ranking[0], "systems_by_team": dict(by_team)}

  - variant: a5
    label: safe_correct
    failure_mode: null
    source: |
      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="system ownership")["chunks"]
          owners = {}
          marker = " is owned by "
          for chunk in chunks:
              text = chunk["text"]
              start = 0
              while True:
                  end = text.find(".", start)
                  if end == -1:
                      break
                  sentence = text[start:end].strip()
                  if marker in sentence:
                      system, team = sentence.split(marker)
                      owners[system] = team
                  start = end + 1
          counts = {}
          for team in owners.values():
              counts[team] = counts.get(team, 0) + 1
          top_team = None
          for team in sorted(counts):
              if top_team is None or counts[team] > counts[top_team]:
                  top_team = team
          return {"top_team": top_team, "owners": owners}

