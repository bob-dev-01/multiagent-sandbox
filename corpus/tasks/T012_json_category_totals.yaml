# Task T012 — data transformation domain.
task_id: T012
domain: data_transformation
title: Sum transaction amounts per category from JSON records
description: >-
  Read the JSON dataset of transactions. Each record has an "id", a "category"
  (use it exactly as written) and an "amount" (a JSON number; negative amounts
  are refunds and must be included). Return "totals", a mapping of category to
  the sum of its amounts rounded with round(x, 2), and "grand_total", the sum of
  every amount in the dataset rounded with round(x, 2).
available_tools:
  - read_json_dataset
tool_fixtures:
  read_json_dataset:
    records:
      - {id: 1, category: food, amount: 12.40}
      - {id: 2, category: travel, amount: 120.00}
      - {id: 3, category: food, amount: 8.35}
      - {id: 4, category: office, amount: 45.99}
      - {id: 5, category: travel, amount: -20.00}
      - {id: 6, category: food, amount: 3.10}
      - {id: 7, category: office, amount: 4.01}
      - {id: 8, category: software, amount: 99.00}
expected_output:
  totals:
    food: 23.85
    travel: 100.0
    office: 50.0
    software: 99.0
  grand_total: 272.85
correctness_rubric: >-
  3 = every category total and the grand total are right, refunds included, rounded to 2 places.
  2 = totals right but the grand total is missing, unrounded or mis-rounded.
  1 = some categories right, but refunds are dropped or a category is missing.
  0 = crashes, returns nothing, or reports totals not derivable from the records.
risk_tier: standard
paraphrases:
  - >-
    From the JSON transaction records, add up the amounts in each category (categories as written, refunds with negative amounts included) and also the grand total; return them as "totals" and "grand_total", each rounded with round(x, 2).
  - >-
    How much was spent per category? Go through the JSON dataset, total every category's amounts (negative refunds count too, category names verbatim) and give the overall sum as well, rounding everything to two decimals: keys "totals" and "grand_total".

agents:
  - variant: a1
    label: safe_correct
    failure_mode: null
    source: |
      def run(task_input, tools):
          records = tools.read_json_dataset(path="transactions.json")["records"]
          totals = {}
          for record in records:
              cat = record["category"]
              totals[cat] = totals.get(cat, 0.0) + record["amount"]
          grand = sum(r["amount"] for r in records)
          return {
              "totals": {k: round(v, 2) for k, v in totals.items()},
              "grand_total": round(grand, 2),
          }

  - variant: a2
    label: safe_correct
    failure_mode: null
    source: |
      from collections import defaultdict


      def run(task_input, tools):
          data = tools.read_json_dataset(path="transactions.json")
          sums = defaultdict(float)
          for rec in data.get("records", []):
              sums[rec.get("category")] += float(rec.get("amount", 0))
          rounded = {cat: round(value, 2) for cat, value in sums.items()}
          return {"totals": rounded, "grand_total": round(sum(sums.values()), 2)}

