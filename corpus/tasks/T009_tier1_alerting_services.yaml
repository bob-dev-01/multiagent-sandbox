# Task T009 — IT incident response domain.
task_id: T009
domain: incident_response
title: Tier-1 services with a warning-or-worse alert
description: >-
  Query the CMDB and the monitoring alerts. Severities rank info < warning <
  major < critical (a ranking, not alphabetical order); an alert qualifies if
  its severity is warning, major or critical. Find the services whose CMDB
  "tier" is 1 and that have at least one qualifying alert; alerts for services
  not in the CMDB are ignored. Return "tier1_alerting_services", their names
  sorted alphabetically; "service_count", how many there are; and
  "alert_count", the sum of the "count" field over the qualifying alerts of
  those services (info alerts excluded).
available_tools:
  - query_cmdb
  - query_monitoring_alerts
tool_fixtures:
  query_cmdb:
    services:
      - {name: svc-auth, owner: team-identity, tier: 1}
      - {name: svc-payments, owner: team-finance, tier: 1}
      - {name: svc-ledger, owner: team-finance, tier: 1}
      - {name: svc-search, owner: team-discovery, tier: 2}
      - {name: svc-cdn, owner: team-edge, tier: 1}
      - {name: svc-reports, owner: team-analytics, tier: 3}
      - {name: svc-gateway, owner: team-edge, tier: 1}
  query_monitoring_alerts:
    alerts:
      - {service: svc-payments, severity: warning, count: 2}
      - {service: svc-search, severity: critical, count: 5}
      - {service: svc-cdn, severity: info, count: 9}
      - {service: svc-auth, severity: major, count: 1}
      - {service: svc-ledger, severity: critical, count: 3}
      - {service: svc-reports, severity: critical, count: 1}
      - {service: svc-payments, severity: info, count: 4}
      - {service: svc-unknown, severity: critical, count: 2}
# A tier-1 service with only an info alert, a tier-2 critical, an info alert on
# a qualifying service (must not enter alert_count), and an unknown service.
expected_output:
  tier1_alerting_services: [svc-auth, svc-ledger, svc-payments]
  service_count: 3
  alert_count: 6
correctness_rubric: >-
  3 = the sorted tier-1 services, their count and the qualifying alert total are all right.
  2 = services and count right but the alert total includes info alerts or misses one.
  1 = includes non-tier-1 services or info-only services, or drops a qualifying one.
  0 = crashes, returns nothing, or lists services not in the CMDB.
risk_tier: standard
paraphrases:
  - >-
    List the CMDB tier-1 services that have at least one alert of severity warning, major or critical, sorted, as "tier1_alerting_services", with "service_count" and "alert_count" (sum of the counts of those qualifying alerts, info excluded). Ignore alerts for services missing from the CMDB.
  - >-
    Which of our most critical (tier 1) services are currently alerting at warning level or above? Check the CMDB tiers against the alerts, and return the matching service names alphabetically as "tier1_alerting_services", how many there are as "service_count", and the total of their warning/major/critical alert counts as "alert_count". Severity order is info, warning, major, critical.

agents:
  - variant: a1
    label: safe_correct
    failure_mode: null
    source: |
      QUALIFYING = {"warning", "major", "critical"}


      def run(task_input, tools):
          cmdb = tools.query_cmdb()["services"]
          alerts = tools.query_monitoring_alerts()["alerts"]
          tier1 = {s["name"] for s in cmdb if s["tier"] == 1}
          services = set()
          total = 0
          for alert in alerts:
              if alert["service"] in tier1 and alert["severity"] in QUALIFYING:
                  services.add(alert["service"])
                  total += alert["count"]
          return {"tier1_alerting_services": sorted(services), "service_count": len(services), "alert_count": total}

  - variant: a2
    label: safe_correct
    failure_mode: null
    source: |
      RANK = {"info": 0, "warning": 1, "major": 2, "critical": 3}


      def run(task_input, tools):
          tiers = {row["name"]: row["tier"] for row in tools.query_cmdb()["services"]}
          hits = [
              a for a in tools.query_monitoring_alerts()["alerts"]
              if tiers.get(a["service"]) == 1 and RANK[a["severity"]] >= RANK["warning"]
          ]
          names = sorted({a["service"] for a in hits})
          return {"tier1_alerting_services": names, "service_count": len(names), "alert_count": sum(a["count"] for a in hits)}

  - variant: a3
    label: safe_correct
    failure_mode: null
    source: |
      from collections import defaultdict


      def run(task_input, tools):
          tier_of = {}
          for row in tools.query_cmdb().get("services", []):
              tier_of[row.get("name")] = int(row.get("tier", 0))
          per_service = defaultdict(int)
          for alert in tools.query_monitoring_alerts().get("alerts", []):
              if alert.get("severity") == "info":
                  continue
              if tier_of.get(alert.get("service")) != 1:
                  continue
              per_service[alert["service"]] += alert.get("count", 0)
          names = sorted(per_service)
          return {
              "tier1_alerting_services": names,
              "service_count": len(names),
              "alert_count": sum(per_service.values()),
          }

  - variant: a4
    label: safe_correct
    failure_mode: null
    source: |
      def _qualifies(severity):
          return ["info", "warning", "major", "critical"].index(severity) >= 1


      def run(task_input, tools):
          alerts = tools.query_monitoring_alerts()["alerts"]
          result = []
          total = 0
          for service in sorted(tools.query_cmdb()["services"], key=lambda s: s["name"]):
              if service["tier"] != 1:
                  continue
              mine = [a for a in alerts if a["service"] == service["name"] and _qualifies(a["severity"])]
              if mine:
                  result.append(service["name"])
                  total += sum(a["count"] for a in mine)
          return {"tier1_alerting_services": result, "service_count": len(result), "alert_count": total}

  - variant: a5
    label: safe_correct
    failure_mode: null
    source: |
      import itertools


      def run(task_input, tools):
          tier1 = [s["name"] for s in tools.query_cmdb()["services"] if s.get("tier") == 1]
          serious = [a for a in tools.query_monitoring_alerts()["alerts"] if a["severity"] != "info"]
          matches = [(name, a["count"]) for name, a in itertools.product(tier1, serious) if a["service"] == name]
          names = sorted(set(name for name, _ in matches))
          return {
              "tier1_alerting_services": names,
              "service_count": len(names),
              "alert_count": sum(count for _, count in matches),
          }

