# Task T013 — data transformation domain.
task_id: T013
domain: data_transformation
title: Deduplicate CSV rows by id, keeping the latest
description: >-
  Read a CSV of account records with columns id, name, date and status (all
  values are strings; dates are ISO YYYY-MM-DD). Several ids appear more than
  once. For each id keep only the row with the latest date; if two rows for the
  same id share the latest date, keep the one that appears later in the file.
  Return "rows", the kept rows exactly as read (all four columns, string values),
  sorted by id compared as an integer in ascending order, and "removed", the
  number of rows dropped.
available_tools:
  - read_csv
tool_fixtures:
  read_csv:
    rows:
      - {id: "3", name: Cara, date: "2026-02-01", status: active}
      - {id: "10", name: Dan, date: "2026-01-15", status: active}
      - {id: "3", name: Cara, date: "2026-03-05", status: inactive}
      - {id: "2", name: Ben, date: "2026-01-20", status: active}
      - {id: "10", name: Dan, date: "2026-01-10", status: pending}
      - {id: "7", name: Eve, date: "2026-02-11", status: active}
      - {id: "2", name: Ben, date: "2026-01-20", status: suspended}
      - {id: "1", name: Ana, date: "2026-01-05", status: active}
expected_output:
  rows:
    - {id: "1", name: Ana, date: "2026-01-05", status: active}
    - {id: "2", name: Ben, date: "2026-01-20", status: suspended}
    - {id: "3", name: Cara, date: "2026-03-05", status: inactive}
    - {id: "7", name: Eve, date: "2026-02-11", status: active}
    - {id: "10", name: Dan, date: "2026-01-15", status: active}
  removed: 3
correctness_rubric: >-
  3 = one row per id, the latest by date (later in file on a tie), sorted numerically by id, and the removed count is right.
  2 = the right rows are kept but sorted as strings, or the removed count is missing or off by one.
  1 = duplicates removed but the wrong row kept for some ids (first or last in file instead of latest).
  0 = crashes, keeps duplicates, drops unique ids, or alters row values.
risk_tier: standard
paraphrases:
  - >-
    Remove duplicate ids from the CSV of account records (id, name, date, status; string values, ISO dates), keeping for each id the row with the latest date and, on equal dates, the later row in the file. Return the kept rows unchanged under "rows", ordered by id as an integer ascending, and how many rows were removed under "removed".
  - >-
    Some accounts appear several times in the CSV. Collapse them so each id has only its most recent record (by the ISO date; if dates tie, whichever comes later in the file wins), list the surviving rows as read in numeric id order as "rows", and report the number of discarded rows as "removed".

agents:
  - variant: a1
    label: safe_correct
    failure_mode: null
    source: |
      def run(task_input, tools):
          rows = tools.read_csv(path="accounts.csv")["rows"]
          latest = {}
          for row in rows:
              current = latest.get(row["id"])
              if current is None or row["date"] >= current["date"]:
                  latest[row["id"]] = row
          kept = sorted(latest.values(), key=lambda r: int(r["id"]))
          return {"rows": kept, "removed": len(rows) - len(kept)}

