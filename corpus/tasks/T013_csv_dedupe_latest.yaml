    source: |
      def run(task_input, tools):
          rows = tools.read_csv(path="accounts.csv")["rows"]
          # Stable sort by date: among equal dates, file order is preserved, so the
          # last row written per id is the latest and, on ties, the later one.
          ordered = sorted(rows, key=lambda r: r["date"])
          winners = {row["id"]: row for row in ordered}
          result = [winners[k] for k in sorted(winners, key=lambda k: int(k))]
          return {"rows": result, "removed": len(rows) - len(result)}

