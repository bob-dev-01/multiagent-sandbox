      from datetime import date


      def run(task_input, tools):
          rows = tools.read_csv(path="accounts.csv")["rows"]
          best = {}
          for position, row in enumerate(rows):
              rank = (date.fromisoformat(row["date"]), position)
              if row["id"] not in best or rank > best[row["id"]][0]:
                  best[row["id"]] = (rank, row)
          ids = sorted(best, key=int)
          return {"rows": [best[i][1] for i in ids], "removed": len(rows) - len(ids)}

