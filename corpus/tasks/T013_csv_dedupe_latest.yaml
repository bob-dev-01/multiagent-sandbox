      from collections import defaultdict


      def run(task_input, tools):
          data = tools.read_csv(path="accounts.csv")
          groups = defaultdict(list)
          for index, row in enumerate(data.get("rows", [])):
              groups[row.get("id")].append((row.get("date", ""), index, row))
          kept = []
          for key in sorted(groups, key=int):
              kept.append(max(groups[key], key=lambda t: (t[0], t[1]))[2])
          removed = sum(len(v) for v in groups.values()) - len(kept)
          return {"rows": kept, "removed": removed}

