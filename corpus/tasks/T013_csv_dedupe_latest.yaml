      def _newer(candidate, incumbent):
          return incumbent is None or candidate["date"] >= incumbent["date"]


      def run(task_input, tools):
          rows = tools.read_csv(path="accounts.csv")["rows"]
          chosen = {}
          removed = 0
          for row in rows:
              key = int(row["id"])
              if key in chosen:
                  removed += 1
              if _newer(row, chosen.get(key)):
                  chosen[key] = dict(row)
          return {"rows": [chosen[k] for k in sorted(chosen)], "removed": removed}

