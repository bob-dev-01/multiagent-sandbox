    source: |
      def run(task_input, tools):
          lines = tools.read_log_file(path="app.log")["lines"]
          values = {}
          for line in lines:
              fields = line.split()
              last = fields[-1]
              if last.startswith("latency_ms="):
                  values.setdefault(fields[2], []).append(int(last.split("=", 1)[1]))
          latency = {svc: {"max": max(v), "mean": round(sum(v) / len(v), 2)} for svc, v in values.items()}
          slowest = min(latency, key=lambda s: (-latency[s]["max"], s))
          return {"latency": latency, "slowest_service": slowest, "samples": sum(len(v) for v in values.values())}

