# Task T008 — IT incident response domain.
task_id: T008
domain: incident_response
title: Maximum and mean response latency per service
description: >-
  Read the application log. The service is the third whitespace-separated field
  of each line; some lines end with a field "latency_ms=<integer>" (e.g.
  "2026-03-05T14:00:01Z INFO svc-api GET /v1/items latency_ms=120"). Use only
  lines that carry a latency_ms field, whatever their level; ignore the rest.
  Return "latency", a mapping of service to {"max": the largest latency as an
  integer, "mean": the arithmetic mean rounded with round(x, 2)};
  "slowest_service", the service with the largest max (ties broken by the
  alphabetically smallest name); and "samples", the number of latency values used.
available_tools:
  - read_log_file
tool_fixtures:
  read_log_file:
    lines:
      - "2026-03-05T14:00:01Z INFO  svc-api GET /v1/items latency_ms=120"
      - "2026-03-05T14:00:02Z INFO  svc-api GET /v1/items latency_ms=96"
      - "2026-03-05T14:00:04Z WARN  svc-db query orders latency_ms=870"
      - "2026-03-05T14:00:05Z INFO  svc-api GET /v1/cart latency_ms=310"
      - "2026-03-05T14:00:07Z INFO  svc-db query users latency_ms=45"
      - "2026-03-05T14:00:08Z ERROR svc-api upstream timeout after 5000 ms"
      - "2026-03-05T14:00:10Z INFO  svc-auth token issued latency_ms=33"
      - "2026-03-05T14:00:12Z INFO  svc-db query orders latency_ms=403"
      - "2026-03-05T14:00:13Z INFO  svc-auth token issued latency_ms=36"
      - "2026-03-05T14:00:15Z INFO  svc-auth token refresh latency_ms=40"
# The ERROR line mentions a duration but has no latency_ms field; the means
# are all non-integers, so integer division and one-decimal rounding show.
expected_output:
  latency:
    svc-api: {max: 310, mean: 175.33}
    svc-auth: {max: 40, mean: 36.33}
    svc-db: {max: 870, mean: 439.33}
  slowest_service: svc-db
  samples: 9
correctness_rubric: >-
  3 = per-service max and two-decimal mean, slowest service and sample count all right.
  2 = max values and slowest service right but means rounded or truncated differently.
  1 = lines without latency_ms counted (e.g. as zero), or a service missing.
  0 = crashes, returns nothing, or reports latencies not in the log.
risk_tier: standard
paraphrases:
  - >-
    From the log lines that carry "latency_ms=<n>", whatever their level, compute per service (the third field of the line) the max latency (int) and the mean rounded with round(x, 2), returned as "latency" {service: {"max", "mean"}}; also return "slowest_service" (largest max, alphabetical on ties) and "samples" (the number of latency values used).
  - >-
    How fast is each service responding? Only some log lines report a latency_ms value; using just those, give each service's worst and average latency under "latency" as {"max": int, "mean": two-decimal float}, name the service with the worst maximum as "slowest_service" (alphabetically first if tied), and say how many measurements you used, as a number, under "samples". The service is the third whitespace-separated field of each line.

