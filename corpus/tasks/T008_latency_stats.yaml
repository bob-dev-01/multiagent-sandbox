      from collections import Counter


      def run(task_input, tools):
          totals, counts, peaks = Counter(), Counter(), {}
          for line in tools.read_log_file(path="app.log")["lines"]:
              *_, tail = line.split()
              if not tail.startswith("latency_ms="):
                  continue
              service = line.split()[2]
              ms = int(tail[len("latency_ms="):])
              totals[service] += ms
              counts[service] += 1
              peaks[service] = ms if service not in peaks else max(peaks[service], ms)
          latency = {s: dict(max=peaks[s], mean=round(totals[s] / counts[s], 2)) for s in peaks}
          ranking = sorted(peaks.items(), key=lambda kv: (-kv[1], kv[0]))
          return {"latency": latency, "slowest_service": ranking[0][0], "samples": sum(counts.values())}

