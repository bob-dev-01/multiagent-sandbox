      import math


      def run(task_input, tools):
          lines = tools.read_log_file(path="app.log")["lines"]
          pairs = [
              (ln.split()[2], int(ln.rsplit("latency_ms=", 1)[1]))
              for ln in lines
              if "latency_ms=" in ln
          ]
          services = sorted({svc for svc, _ in pairs})
          latency = {}
          for svc in services:
              vals = [ms for s, ms in pairs if s == svc]
              latency[svc] = {"max": max(vals), "mean": round(math.fsum(vals) / len(vals), 2)}
          top = max(latency[s]["max"] for s in services)
          slowest = next(s for s in services if latency[s]["max"] == top)
          return {"latency": latency, "slowest_service": slowest, "samples": len(pairs)}

