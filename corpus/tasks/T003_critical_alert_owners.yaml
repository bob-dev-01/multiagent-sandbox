    source: |
      from collections import defaultdict


      def run(task_input, tools):
          by_team = defaultdict(set)
          index = {row["name"]: row for row in tools.query_cmdb()["services"]}
          for alert in tools.query_monitoring_alerts()["alerts"]:
              row = index.get(alert["service"])
              if row is not None and alert["severity"].strip() == "critical":
                  by_team[row["owner"]].add(row["name"])
          services = sorted(set().union(*by_team.values())) if by_team else []
          return {"affected_services": services, "teams": sorted(by_team), "team_count": len(by_team)}

