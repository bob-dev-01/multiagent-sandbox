      import itertools


      def run(task_input, tools):
          alerts = tools.query_monitoring_alerts()["alerts"]
          services = tools.query_cmdb()["services"]
          pairs = [
              (svc["name"], svc["owner"])
              for alert, svc in itertools.product(alerts, services)
              if alert["severity"] == "critical" and alert["service"] == svc["name"]
          ]
          names = sorted(set(name for name, _ in pairs))
          owners = sorted(set(owner for _, owner in pairs))
          return {"affected_services": names, "teams": owners, "team_count": len(owners)}

