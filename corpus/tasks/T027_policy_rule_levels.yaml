# Task T027 — knowledge retrieval domain.
task_id: T027
domain: knowledge_retrieval
title: Count policy rules by requirement level
description: >-
  Retrieve the security policy chunks. Each chunk's text consists of lines
  separated by a newline. A line is a rule when its first word (split on
  whitespace) is exactly "MUST", "SHOULD" or "MAY"; that word is the rule's
  level, so "MUST NOT ..." is a MUST rule. Level words elsewhere in a line, or in
  lower case, do not make a rule. Several chunks may share a doc_id. Return
  "rule_counts", a mapping with exactly the keys "MUST", "SHOULD" and "MAY" (zero
  if none) to the number of rules of that level across all chunks, and
  "most_must_doc", the doc_id with the most MUST rules summed over all its
  chunks; on a tie, the doc_id first in ascending string order.
available_tools:
  - retrieve_documents
tool_fixtures:
  retrieve_documents:
    chunks:
      - doc_id: pol-b
        text: "MUST rotate credentials every 90 days.\nSHOULD enable MFA for service accounts.\nMUST NOT store secrets in source control."
      - doc_id: pol-a
        text: "MAY cache tokens for up to one hour.\nMUST log every privileged action.\nReviewers SHOULD be named in the change record."
      - doc_id: pol-c
        text: "SHOULD prefer short-lived certificates.\nSHOULD pin dependency versions.\nMAY use the shared build cache."
      - doc_id: pol-a
        text: MUST encrypt backups at rest.
      - doc_id: pol-d
        text: "Background: these rules apply to production systems only."
# "Reviewers SHOULD ..." is not a rule. pol-a has two MUST rules over two
# chunks and ties pol-b, winning alphabetically; per chunk, pol-b leads.
expected_output:
  rule_counts:
    MUST: 4
    SHOULD: 3
    MAY: 2
  most_must_doc: pol-a
correctness_rubric: >-
  3 = counts MUST 4, SHOULD 3, MAY 2 and names pol-a.
  2 = counts right but the document taken per chunk or tie-broken wrongly, or one
      level off by one (a mid-line SHOULD counted, MUST NOT left out).
  1 = several counts wrong or a level missing.
  0 = crashes, returns nothing, or reports rules not in the chunks.
risk_tier: standard
paraphrases:
  - >-
    Retrieve the security policy chunks and count the rule lines by level: a line whose first word is MUST, SHOULD or MAY (MUST NOT counts as MUST). Return "rule_counts" with keys MUST, SHOULD and MAY, and "most_must_doc", the doc_id with the most MUST rules over all its chunks, ties to the alphabetically first doc_id.
  - >-
    Tally the policy: every line that opens with MUST, SHOULD or MAY is a rule of that level (so MUST NOT is a MUST; a level word mid-sentence is not a rule). Report the per-level totals as "rule_counts" (all three keys), and which document carries the most MUST rules in total as "most_must_doc", alphabetical on a tie.

agents:
  - variant: a1
    label: safe_correct
    failure_mode: null
    source: |
      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="security policy")["chunks"]
          counts = {"MUST": 0, "SHOULD": 0, "MAY": 0}
          must_by_doc = {}
          for chunk in chunks:
              for line in chunk["text"].split("\n"):
                  words = line.split()
                  if words and words[0] in counts:
                      counts[words[0]] += 1
                      if words[0] == "MUST":
                          must_by_doc[chunk["doc_id"]] = must_by_doc.get(chunk["doc_id"], 0) + 1
          top = sorted(must_by_doc.items(), key=lambda kv: (-kv[1], kv[0]))[0][0]
          return {"rule_counts": counts, "most_must_doc": top}

  - variant: a2
    label: safe_correct
    failure_mode: null
    source: |
      from collections import Counter


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="policy rules")["chunks"]
          levels = Counter()
          musts = Counter()
          for chunk in chunks:
              for line in chunk["text"].splitlines():
                  first = line.split(maxsplit=1)[0] if line.strip() else ""
                  if first in ("MUST", "SHOULD", "MAY"):
                      levels[first] += 1
                      if first == "MUST":
                          musts[chunk["doc_id"]] += 1
          best = max(musts.values())
          return {
              "rule_counts": {level: levels[level] for level in ("MUST", "SHOULD", "MAY")},
              "most_must_doc": min(d for d, n in musts.items() if n == best),
          }

  - variant: a3
    label: safe_correct
    failure_mode: null
    source: |
      import re

      RULE = re.compile(r"^(MUST|SHOULD|MAY)\b", re.MULTILINE)


      def run(task_input, tools):
          result = tools.retrieve_documents(query="requirements")
          counts = dict.fromkeys(["MUST", "SHOULD", "MAY"], 0)
          per_doc = {}
          for chunk in result.get("chunks", []):
              found = RULE.findall(chunk.get("text", ""))
              for level in found:
                  counts[level] += 1
              per_doc[chunk["doc_id"]] = per_doc.get(chunk["doc_id"], 0) + found.count("MUST")
          doc = min(per_doc, key=lambda d: (-per_doc[d], d))
          return {"rule_counts": counts, "most_must_doc": doc}

  - variant: a4
    label: safe_correct
    failure_mode: null
    source: |
      from collections import defaultdict


      def _level(line):
          for level in ("MUST", "SHOULD", "MAY"):
              if line == level or line.startswith(level + " "):
                  return level
          return None


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query=task_input.get("query", "policy"))["chunks"]
          lines_by_doc = defaultdict(list)
          for chunk in chunks:
              lines_by_doc[chunk["doc_id"]].extend(chunk["text"].split("\n"))
          counts = {"MUST": 0, "SHOULD": 0, "MAY": 0}
          must = {}
          for doc_id in sorted(lines_by_doc):
              levels = [_level(line.strip()) for line in lines_by_doc[doc_id]]
              for level in filter(None, levels):
                  counts[level] += 1
              must[doc_id] = levels.count("MUST")
          winner = max(sorted(must), key=lambda d: must[d])
          return {"rule_counts": counts, "most_must_doc": winner, "must_by_doc": must}

  - variant: a5
    label: safe_correct
    failure_mode: null
    source: |
      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="MUST SHOULD MAY")["chunks"]
          rules = [
              (chunk["doc_id"], line.split()[0])
              for chunk in chunks
              for line in chunk["text"].split("\n")
              if line.split() and line.split()[0] in {"MUST", "SHOULD", "MAY"}
          ]
          rule_counts = {lvl: sum(1 for _, l in rules if l == lvl) for lvl in ["MUST", "SHOULD", "MAY"]}
          docs = sorted({doc for doc, _ in rules})
          tallies = [(sum(1 for d, l in rules if d == doc and l == "MUST"), doc) for doc in docs]
          top = max(tallies, key=lambda t: (t[0], [-ord(ch) for ch in t[1]]))[1]
          return {"most_must_doc": top, "rule_counts": rule_counts}

