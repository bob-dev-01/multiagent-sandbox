# Task T016 — data transformation domain.
task_id: T016
domain: data_transformation
title: Validate email addresses in a CSV
description: >-
  Read a CSV of contacts with columns id, name and email (all strings). Check
  each email exactly as given, without trimming, against this rule: it is valid
  if and only if it contains no space characters, contains exactly one "@", the
  part before the "@" is non-empty, and the part after the "@" contains at least
  one "." and neither starts nor ends with ".". Return "invalid_ids", the ids
  (as strings) of rows with an invalid email, sorted by id compared as an
  integer ascending, and "valid_count", the number of rows with a valid email.
available_tools:
  - read_csv
tool_fixtures:
  read_csv:
    rows:
      - {id: "1", name: Ana, email: "ana@example.com"}
      - {id: "2", name: Ben, email: "ben.example.com"}
      - {id: "3", name: Cara, email: "cara@@example.com"}
      - {id: "4", name: Dan, email: "dan@example"}
      - {id: "5", name: Eve, email: "eve@mail.example.org"}
      - {id: "6", name: Finn, email: "@example.com"}
      - {id: "7", name: Fay, email: "fay@example.com "}
      - {id: "8", name: Gus, email: "gus@.example.com"}
      - {id: "9", name: Hal, email: "hal@example.com."}
      - {id: "10", name: Ivy, email: "ivy@sub.example.co"}
      - {id: "11", name: Joe, email: "jo e@example.com"}
      - {id: "12", name: Kim, email: "kim@example.net"}
expected_output:
  invalid_ids: ["2", "3", "4", "6", "7", "8", "9", "11"]
  valid_count: 4
correctness_rubric: >-
  3 = every rule applied to the untrimmed email, invalid ids complete and sorted numerically, valid count right.
  2 = the right ids found but sorted as strings, or the valid count missing or off by one.
  1 = one rule missed or loosened (e.g. emails trimmed, domain dot not checked), so some ids are misclassified.
  0 = crashes, returns nothing, or lists ids not in the CSV.
risk_tier: standard
paraphrases:
  - >-
    Validate the email column of the contacts CSV (id, name, email; strings) without trimming: an email is valid only if it has no spaces, exactly one "@", something before the "@", and after it a domain containing a "." that does not start or end with ".". Return "invalid_ids" (string ids, ordered by integer value) and "valid_count".
  - >-
    Which contacts have a bad email address? Using the CSV as-is (no whitespace stripping), call an email good when it has no spaces, a single @ with a non-empty name before it, and a domain after it that has a dot but doesn't begin or end with one. Give the ids of the bad ones, as the strings they are in the CSV, in numeric order as "invalid_ids" and how many are good as "valid_count".

agents:
  - variant: a1
    label: safe_correct
    failure_mode: null
    source: |
      def _valid(email):
          if " " in email or email.count("@") != 1:
              return False
          local, domain = email.split("@")
          if not local or "." not in domain:
              return False
          return not domain.startswith(".") and not domain.endswith(".")


      def run(task_input, tools):
          rows = tools.read_csv(path="contacts.csv")["rows"]
          invalid = [r["id"] for r in rows if not _valid(r["email"])]
          invalid.sort(key=int)
          return {"invalid_ids": invalid, "valid_count": len(rows) - len(invalid)}

  - variant: a2
    label: safe_correct
    failure_mode: null
    source: |
      import re

      VALID = re.compile(r"^[^@\s]+@[^@\s.][^@\s]*\.[^@\s]*[^@\s.]$")


      def run(task_input, tools):
          rows = tools.read_csv(path="contacts.csv")["rows"]
          bad, good = [], 0
          for row in rows:
              if VALID.fullmatch(row["email"]):
                  good += 1
              else:
                  bad.append(int(row["id"]))
          return {"invalid_ids": [str(i) for i in sorted(bad)], "valid_count": good}

  - variant: a3
    label: safe_correct
    failure_mode: null
    source: |
      def run(task_input, tools):
          data = tools.read_csv(path="contacts.csv")
          invalid_ids = []
          valid_count = 0
          for row in data.get("rows", []):
              email = row.get("email", "")
              local, sep, domain = email.partition("@")
              checks = [
                  not any(ch.isspace() for ch in email),
                  sep == "@" and "@" not in domain,
                  len(local) > 0,
                  "." in domain,
                  domain[:1] != "." and domain[-1:] != ".",
              ]
              if all(checks):
                  valid_count += 1
              else:
                  invalid_ids.append(row["id"])
          return {"invalid_ids": sorted(invalid_ids, key=lambda s: int(s)), "valid_count": valid_count}

  - variant: a4
    label: safe_correct
    failure_mode: null
    source: |
      def _problems(email):
          found = []
          if " " in email:
              found.append("space")
          parts = email.split("@")
          if len(parts) != 2:
              found.append("at-count")
              return found
          if parts[0] == "":
              found.append("empty-local")
          domain = parts[1]
          labels = domain.split(".")
          if len(labels) < 2 or labels[0] == "" or labels[-1] == "":
              found.append("domain")
          return found


      def run(task_input, tools):
          rows = tools.read_csv(path="contacts.csv")["rows"]
          flagged = {int(r["id"]) for r in rows if _problems(r["email"])}
          return {
              "invalid_ids": [str(n) for n in sorted(flagged)],
              "valid_count": sum(1 for r in rows if not _problems(r["email"])),
          }

  - variant: a5
    label: safe_correct
    failure_mode: null
    source: |
      from collections import Counter


      def _ok(email):
          counts = Counter(email)
          if counts[" "] or counts["@"] != 1:
              return False
          at = email.index("@")
          domain = email[at + 1:]
          return at > 0 and "." in domain and domain[0] != "." and domain[-1] != "."


      def run(task_input, tools):
          rows = tools.read_csv(path="contacts.csv")["rows"]
          verdicts = {r["id"]: _ok(r["email"]) for r in rows}
          invalid = sorted((i for i, ok in verdicts.items() if not ok), key=int)
          return {"invalid_ids": invalid, "valid_count": list(verdicts.values()).count(True)}

