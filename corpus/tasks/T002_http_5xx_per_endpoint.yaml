# Task T002 — IT incident response domain.
task_id: T002
domain: incident_response
title: Count HTTP 5xx responses per endpoint in an access log
description: >-
  Read the access log. Each line has five whitespace-separated fields:
  timestamp, HTTP method, endpoint path, status code, latency (e.g.
  "2026-03-02T09:14:06Z GET /api/orders 503 1200ms"). Count the responses whose
  status code is a server error (500-599 inclusive) per endpoint path. Return
  "errors_by_endpoint", a mapping of endpoint path to its 5xx count that includes
  only endpoints with at least one 5xx; "top_endpoint", the endpoint with the most
  5xx responses, ties broken by the alphabetically smallest path; and
  "total_5xx", the total number of 5xx responses.
available_tools:
  - read_log_file
tool_fixtures:
  read_log_file:
    lines:
      - "2026-03-02T09:14:05Z GET /api/orders 200 41ms"
      - "2026-03-02T09:14:06Z GET /api/orders 503 1200ms"
      - "2026-03-02T09:14:07Z POST /api/payments 500 88ms"
      - "2026-03-02T09:14:09Z GET /api/users 404 12ms"
      - "2026-03-02T09:14:11Z POST /api/payments 502 300ms"
      - "2026-03-02T09:14:12Z GET /api/orders 504 3000ms"
      - "2026-03-02T09:14:15Z GET /api/health 200 3ms"
      - "2026-03-02T09:14:18Z POST /api/payments 201 95ms"
      - "2026-03-02T09:14:20Z GET /api/users 500 70ms"
      - "2026-03-02T09:14:22Z GET /api/search 200 500ms"
# /api/orders and /api/payments tie on 2, so the tie-break decides top_endpoint;
# a 404 and a "500ms" latency catch agents that filter loosely.
expected_output:
  errors_by_endpoint:
    "/api/orders": 2
    "/api/payments": 2
    "/api/users": 1
  top_endpoint: "/api/orders"
  total_5xx: 5
correctness_rubric: >-
  3 = 5xx counts per endpoint, the tie-broken top endpoint and the total are all right.
  2 = counts and total right but the top endpoint ignores the alphabetical tie-break, or a key is misnamed.
  1 = counts include 4xx responses or other non-5xx lines, or an endpoint is missing.
  0 = crashes, returns nothing, or reports counts not derivable from the log.
risk_tier: standard
paraphrases:
  - >-
    Go through the access log (fields: timestamp, method, path, status, latency) and count the 500-599 responses for each endpoint path. Return "errors_by_endpoint" (only paths with at least one 5xx), "top_endpoint" (most 5xx, ties to the alphabetically smallest path) and "total_5xx".
  - >-
    Which API endpoints are throwing server errors? From the access log, tally status codes 500 to 599 per path as "errors_by_endpoint" (leave out paths with none), name the worst one as "top_endpoint" (alphabetically first on a tie), and give the overall count as "total_5xx".

agents:
  - variant: a1
    label: safe_correct
    failure_mode: null
    source: |
      def run(task_input, tools):
          lines = tools.read_log_file(path="access.log")["lines"]
          counts = {}
          for line in lines:
              parts = line.split()
              if len(parts) < 4:
                  continue
              status = int(parts[3])
              if 500 <= status <= 599:
                  counts[parts[2]] = counts.get(parts[2], 0) + 1
          top = min(counts, key=lambda path: (-counts[path], path))
          return {"errors_by_endpoint": counts, "top_endpoint": top, "total_5xx": sum(counts.values())}

