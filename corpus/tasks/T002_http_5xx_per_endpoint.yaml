    source: |
      def _is_server_error(code):
          return code.isdigit() and 500 <= int(code) < 600


      def run(task_input, tools):
          data = tools.read_log_file(path="access.log")
          counts = {}
          total = 0
          for raw in data.get("lines", []):
              _, _method, path, code, _latency = raw.split()
              if _is_server_error(code):
                  counts.setdefault(path, 0)
                  counts[path] += 1
                  total += 1
          highest = max(counts.values()) if counts else 0
          top = sorted(p for p, n in counts.items() if n == highest)[0] if counts else None
          return {"errors_by_endpoint": counts, "top_endpoint": top, "total_5xx": total}

