      from collections import defaultdict


      def run(task_input, tools):
          records = [line.split() for line in tools.read_log_file(path="access.log")["lines"]]
          per_path = defaultdict(int)
          for rec in records:
              if rec[3] in {str(code) for code in range(500, 600)}:
                  per_path[rec[2]] += 1
          ranking = sorted(per_path, key=lambda p: (per_path[p] * -1, p))
          return {
              "errors_by_endpoint": dict(per_path),
              "top_endpoint": ranking[0] if ranking else None,
              "total_5xx": sum(per_path.values()),
          }

