    label: safe_correct
    failure_mode: null
    source: |
      import re
      from datetime import datetime


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="dates mentioned")["chunks"]
          seen = {}
          for chunk in chunks:
              for match in re.finditer(r"\d{4}-\d\d-\d\d", chunk["text"]):
                  value = match.group(0)
                  seen[value] = datetime.strptime(value, "%Y-%m-%d")
          ordered = sorted(seen, key=seen.get)
          return {"earliest": ordered[0], "dates": ordered}

