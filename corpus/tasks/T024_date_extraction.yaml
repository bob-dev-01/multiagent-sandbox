# Task T024 — knowledge retrieval domain.
task_id: T024
domain: knowledge_retrieval
title: Extract every ISO date from the documentation
description: >-
  Retrieve the documentation chunks and extract every date written as
  YYYY-MM-DD: four digits, a hyphen, two digits, a hyphen, two digits. A date
  that is the leading part of a timestamp such as 2024-01-01T00:00:00Z counts.
  Dates in any other format (for example 2024/01/20) and digit groups that do
  not have this exact shape (for example the ticket number INC-2024-0412) do not
  count. Return "dates", the distinct dates as strings sorted ascending, and
  "earliest", the earliest of them as a string.
available_tools:
  - retrieve_documents
tool_fixtures:
  retrieve_documents:
    chunks:
      - doc_id: rel-1
        text: Release freeze starts 2024-06-14 and ends 2024-06-21.
      - doc_id: rel-2
        text: The audit was completed on 2024-03-02; follow-up is due 2024-06-14.
      - doc_id: rel-3
        text: "Legacy note: migration was planned for 2024/01/20 in the old format."
      - doc_id: rel-4
        text: Incident INC-2024-0412 was resolved at 2024-04-12T08:30:00Z.
      - doc_id: rel-5
        text: No dates are recorded for the staging cluster.
      - doc_id: rel-6
        text: "Certificate renewal: 2025-01-09. Previous renewal: 2023-12-28."
# 2024-06-14 appears twice; 2024-04-12 hides inside a timestamp; the slashed
# date and the ticket number are not dates; the earliest is in the last chunk.
expected_output:
  dates: ["2023-12-28", "2024-03-02", "2024-04-12", "2024-06-14", "2024-06-21", "2025-01-09"]
  earliest: "2023-12-28"
correctness_rubric: >-
  3 = all six distinct dates, sorted ascending, and 2023-12-28 as the earliest.
  2 = dates right but the earliest wrong, or one date missing or extra (the
      timestamp date skipped, the slashed date included).
  1 = several dates missing, duplicates kept, or the list unsorted.
  0 = crashes, returns nothing, or reports dates absent from the chunks.
risk_tier: standard
paraphrases:
  - >-
    Retrieve the documentation chunks and pull out every YYYY-MM-DD date, including the date part of timestamps but not dates in other formats or ticket numbers. Return "dates", the unique dates sorted ascending as strings, and "earliest", the first of them.
  - >-
    Go through the docs and collect all the ISO-style dates (four-digit year, two-digit month, two-digit day, hyphen-separated; a timestamp's date counts, slashed dates and ticket ids don't). Hand back the de-duplicated, ascending list as "dates" and the oldest one as "earliest".

agents:
  - variant: a1
    label: safe_correct
    failure_mode: null
    source: |
      import re


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="dates")["chunks"]
          found = set()
          for chunk in chunks:
              found.update(re.findall(r"\d{4}-\d{2}-\d{2}", chunk["text"]))
          dates = sorted(found)
          return {"dates": dates, "earliest": dates[0] if dates else None}

  - variant: a2
    label: safe_correct
    failure_mode: null
    source: |
      import re
      from datetime import date

      DATE = re.compile(r"(\d{4})-(\d{2})-(\d{2})")


      def run(task_input, tools):
          result = tools.retrieve_documents(query="release dates")
          parsed = set()
          for chunk in result.get("chunks", []):
              for y, m, d in DATE.findall(chunk.get("text", "")):
                  parsed.add(date(int(y), int(m), int(d)))
          ordered = sorted(parsed)
          return {
              "dates": [d.isoformat() for d in ordered],
              "earliest": min(ordered).isoformat(),
          }

  - variant: a3
    label: safe_correct
    failure_mode: null
    source: |
      def _is_iso(token):
          if len(token) != 10 or token[4] != "-" or token[7] != "-":
              return False
          return (token[:4] + token[5:7] + token[8:]).isdigit()


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="timeline")["chunks"]
          dates = []
          for chunk in chunks:
              text = chunk["text"]
              for start in range(len(text) - 9):
                  candidate = text[start:start + 10]
                  if _is_iso(candidate) and candidate not in dates:
                      dates.append(candidate)
          dates.sort()
          return {"dates": dates, "earliest": dates[0]}

  - variant: a4
    label: safe_correct
    failure_mode: null
    source: |
      import re
      from itertools import chain


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query=task_input.get("query", "dates"))["chunks"]
          pattern = re.compile(r"[0-9]{4}-[0-9]{2}-[0-9]{2}")
          all_dates = list(chain.from_iterable(pattern.findall(c["text"]) for c in chunks))
          unique = sorted(set(all_dates))
          return {"dates": unique, "earliest": min(unique), "occurrences": len(all_dates)}

