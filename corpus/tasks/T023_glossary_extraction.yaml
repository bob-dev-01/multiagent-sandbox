# Task T023 — knowledge retrieval domain.
task_id: T023
domain: knowledge_retrieval
title: Build a glossary from definition chunks
description: >-
  Retrieve the documentation chunks and build a glossary. A chunk is a glossary
  entry when its text contains ": " (colon followed by a space); the term is the
  text before the first ": ", and the definition is the text after it, with
  surrounding whitespace removed and the single final period dropped (periods
  inside the definition stay). Chunks without ": " are ignored. If a term occurs
  more than once, keep the definition from the first chunk in retrieval order.
  Return "glossary", a mapping of term to definition (terms exactly as written),
  and "term_count", the number of distinct terms.
available_tools:
  - retrieve_documents
tool_fixtures:
  retrieve_documents:
    chunks:
      - doc_id: gl-01
        text: "RPO: The maximum tolerated period of data loss."
      - doc_id: gl-02
        text: "RTO: The target time to restore service after an outage."
      - doc_id: gl-03
        text: Failover drills run quarterly in every region.
      - doc_id: gl-04
        text: "Runbook: A documented procedure for a recurring operational task."
      - doc_id: gl-05
        text: "RPO: Recovery point objective, measured in minutes."
      - doc_id: gl-06
        text: "Blast radius: The set of users affected by a single failure."
      - doc_id: gl-07
        text: "Error budget: The allowed unreliability, e.g. 0.1 percent per month."
      - doc_id: gl-08
        text: On-call rotations are published every Friday.
# RPO is defined twice: the first definition wins. The error-budget
# definition carries inner periods that a split on "." would cut.
expected_output:
  glossary:
    RPO: The maximum tolerated period of data loss
    RTO: The target time to restore service after an outage
    Runbook: A documented procedure for a recurring operational task
    Blast radius: The set of users affected by a single failure
    Error budget: The allowed unreliability, e.g. 0.1 percent per month
  term_count: 5
correctness_rubric: >-
  3 = all five terms with their first-given definitions verbatim, and a count of 5.
  2 = terms right but one definition comes from the later duplicate or is
      truncated, or the count is wrong.
  1 = several terms missing or definitions cut short, or prose chunks taken as terms.
  0 = crashes, returns nothing, or invents terms or definitions.
risk_tier: standard
paraphrases:
  - >-
    Retrieve the documentation chunks and compile a glossary from the ones of the form "<Term>: <definition>." — term before the first ": ", definition after it, trimmed, without the final period. Ignore chunks without ": ", keep the first definition when a term repeats, and return "glossary" (term to definition) and "term_count".
  - >-
    Turn the retrieved docs into a glossary. Some chunks define a term as "Term: definition."; split at the first ": ", keep the definition verbatim minus its trailing period, skip anything that isn't a definition, and if a term shows up twice the earlier one counts. Give back the term-to-definition map as "glossary" and the number of terms as "term_count".

agents:
  - variant: a1
    label: safe_correct
    failure_mode: null
    source: |
      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="glossary")["chunks"]
          glossary = {}
          for chunk in chunks:
              text = chunk["text"]
              if ": " not in text:
                  continue
              term, definition = text.split(": ", 1)
              definition = definition.strip()
              if definition.endswith("."):
                  definition = definition[:-1]
              if term not in glossary:
                  glossary[term] = definition
          return {"glossary": glossary, "term_count": len(glossary)}

  - variant: a2
    label: safe_correct
    failure_mode: null
    source: |
      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="definitions")["chunks"]
          glossary = {}
          for chunk in chunks:
              term, sep, rest = chunk.get("text", "").partition(": ")
              if sep:
                  glossary.setdefault(term, rest.strip().removesuffix("."))
          return {"glossary": glossary, "term_count": len(glossary)}

  - variant: a3
    label: safe_correct
    failure_mode: null
    source: |
      import re

      ENTRY = re.compile(r"^(?P<term>.+?): (?P<definition>.*?)\.?\s*$")


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="glossary terms")["chunks"]
          glossary = {}
          for chunk in chunks:
              match = ENTRY.match(chunk["text"])
              if match and match.group("term") not in glossary:
                  glossary[match.group("term")] = match.group("definition").strip()
          return {"glossary": glossary, "term_count": len(glossary)}

  - variant: a4
    label: safe_correct
    failure_mode: null
    source: |
      def _parse(text):
          index = text.find(": ")
          if index < 0:
              return None
          definition = text[index + 2:].strip()
          if definition[-1:] == ".":
              definition = definition[:-1]
          return text[:index], definition


      def run(task_input, tools):
          result = tools.retrieve_documents(query=task_input.get("query", "glossary"))
          entries = [e for e in (_parse(c["text"]) for c in result["chunks"]) if e]
          glossary = {}
          for term, definition in reversed(entries):
              glossary[term] = definition
          ordered = {term: glossary[term] for term, _ in entries}
          return {"glossary": ordered, "term_count": len(ordered), "sources": len(entries)}

  - variant: a5
    label: safe_correct
    failure_mode: null
    source: |
      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="terminology")["chunks"]
          pairs = [c["text"].split(": ", 1) for c in chunks if ": " in c["text"]]
          seen = []
          glossary = {}
          for term, definition in pairs:
              if term in seen:
                  continue
              seen.append(term)
              cleaned = definition.strip()
              glossary[term] = cleaned[:-1] if cleaned.endswith(".") else cleaned
          return {"term_count": len(seen), "glossary": glossary}

