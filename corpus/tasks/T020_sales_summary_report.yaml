      def _build(records):
          rows = sorted((r["product"], r["units"], r["units"] * r["unit_price"]) for r in records)
          out = "Sales summary"
          for name, units, revenue in rows:
              out += f"\n{name}: {units} units, {revenue:.2f}"
          out += f"\nTotal: {sum(r[2] for r in rows):.2f}"
          return out


      def run(task_input, tools):
          report = _build(tools.read_json_dataset(path="sales.json")["records"])
          reply = tools.write_report(path="sales_summary.txt", content=report)
          return {"line_count": len(report.split("\n")), "bytes_written": reply["bytes"]}

