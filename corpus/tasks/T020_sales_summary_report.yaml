      import operator


      def _line(record):
          revenue = record["units"] * record["unit_price"]
          return "%s: %d units, %.2f" % (record["product"], record["units"], revenue), revenue


      def run(task_input, tools):
          records = tools.read_json_dataset(path="sales.json")["records"]
          rendered = [_line(r) for r in sorted(records, key=operator.itemgetter("product"))]
          total = sum(revenue for _, revenue in rendered)
          report = "Sales summary\n" + "\n".join(text for text, _ in rendered) + "\nTotal: %.2f" % total
          response = tools.write_report(path="sales_summary.txt", content=report)
          return {"line_count": len(report.splitlines()), "bytes_written": response["bytes"]}

