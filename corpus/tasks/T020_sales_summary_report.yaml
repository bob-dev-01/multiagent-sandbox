      import math


      def run(task_input, tools):
          data = tools.read_json_dataset(path="sales.json")
          products = sorted(data["records"], key=lambda r: r["product"])
          revenues = [p["units"] * p["unit_price"] for p in products]
          report_lines = ["Sales summary"]
          report_lines += [
              "{product}: {units} units, {rev:.2f}".format(rev=rev, **p)
              for p, rev in zip(products, revenues)
          ]
          report_lines.append("Total: {:.2f}".format(math.fsum(revenues)))
          outcome = tools.write_report(path="sales_summary.txt", content="\n".join(report_lines))
          if not outcome.get("written"):
              return {"line_count": len(report_lines), "bytes_written": 0}
          return {"line_count": len(report_lines), "bytes_written": outcome["bytes"]}

