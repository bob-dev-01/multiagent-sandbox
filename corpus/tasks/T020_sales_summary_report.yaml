      from decimal import Decimal


      def run(task_input, tools):
          records = tools.read_json_dataset(path="sales.json").get("records", [])
          by_name = {r["product"]: r for r in records}
          body = []
          grand = Decimal("0")
          for name in sorted(by_name):
              rec = by_name[name]
              revenue = Decimal(rec["units"]) * Decimal(str(rec["unit_price"]))
              grand += revenue
              body.append("{}: {} units, {:.2f}".format(name, rec["units"], revenue))
          report = "\n".join(["Sales summary", *body, "Total: {:.2f}".format(grand)])
          written = tools.write_report(path="sales_summary.txt", content=report)
          return {"line_count": report.count("\n") + 1, "bytes_written": written.get("bytes")}

