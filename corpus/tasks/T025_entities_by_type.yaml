      def _clean(entities):
          for entity in entities:
              yield entity["type"], entity["value"].strip()


      def run(task_input, tools):
          tools.retrieve_documents(query="shipment report")
          entities = tools.extract_structured_data(text="shipment report")["entities"]
          types = sorted({kind for kind, _ in _clean(entities)})
          by_type = {
              kind: sorted({value for k, value in _clean(entities) if k == kind})
              for kind in types
          }
          return {"type_count": len(types), "entities_by_type": by_type}

