      def run(task_input, tools):
          sheets = tools.read_spreadsheet(path="sales.xlsx").get("sheets", {})
          quarter_names = sorted(n for n in sheets if n.startswith("Q") and n[1:].isdigit())
          totals = {}
          for name in quarter_names:
              data_rows = sheets[name][1:]
              cleaned = [r for r in data_rows if len(r) >= 2 and isinstance(r[1], (int, float))]
              totals[name] = round(sum(r[1] for r in cleaned), 2)
          top = max(totals.values())
          best = next(name for name in quarter_names if totals[name] == top)
          return {"quarter_totals": totals, "best_quarter": best}

