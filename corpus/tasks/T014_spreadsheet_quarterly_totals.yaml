      import math


      def run(task_input, tools):
          sheets = tools.read_spreadsheet(path="sales.xlsx")["sheets"]
          quarter_totals = {}
          best_quarter, best_value = None, -math.inf
          for number in range(1, 5):
              name = f"Q{number}"
              amounts = [row[1] for row in sheets[name][1:] if row[1] is not None]
              value = round(math.fsum(amounts), 2)
              quarter_totals[name] = value
              if value > best_value:
                  best_quarter, best_value = name, value
          return {"quarter_totals": quarter_totals, "best_quarter": best_quarter}

