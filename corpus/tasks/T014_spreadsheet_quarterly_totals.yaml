# Task T014 — data transformation domain.
task_id: T014
domain: data_transformation
title: Quarterly totals from a spreadsheet, plus the best quarter
description: >-
  Read the sales spreadsheet. It has one sheet per quarter, named "Q1" to "Q4";
  ignore any other sheet. Each quarter sheet's first row is the header
  ["region", "amount"] and every later row is [region, amount], where amount is a
  number or empty (null); skip rows whose amount is empty. Return
  "quarter_totals", a mapping of quarter sheet name to the sum of its amounts
  rounded with round(x, 2), and "best_quarter", the quarter with the highest
  total; if quarters tie, choose the earliest (Q1 before Q2, and so on).
available_tools:
  - read_spreadsheet
tool_fixtures:
  read_spreadsheet:
    sheets:
      Q1:
        - [region, amount]
        - [North, 1200]
        - [South, 850.5]
        - [West, 430]
      Q2:
        - [region, amount]
        - [North, 1500]
        - [South, 900]
        - [West, null]
        - [East, 120.25]
      Q3:
        - [region, amount]
        - [North, 1100]
        - [South, 1000]
        - [West, 420.25]
      Q4:
        - [region, amount]
        - [North, 1300]
        - [South, 700]
      Notes:
        - [comment]
        - [Q3 includes late invoices]
expected_output:
  quarter_totals:
    Q1: 2480.5
    Q2: 2520.25
    Q3: 2520.25
    Q4: 2000
  best_quarter: Q2
correctness_rubric: >-
  3 = all four quarter totals right, empty cells skipped, other sheets ignored, and the tie resolved to the earliest quarter.
  2 = totals right but the tie is resolved to the later quarter, or best_quarter is missing.
  1 = some quarter totals wrong (a header or data row miscounted) or a non-quarter sheet included.
  0 = crashes on the empty cell, returns nothing, or fabricates totals.
risk_tier: standard
paraphrases:
  - >-
    The sales spreadsheet has a sheet per quarter (Q1 to Q4) plus possibly others to ignore; each quarter sheet starts with a ["region", "amount"] header and then [region, amount] rows, where an empty amount is skipped. Return each quarter's total under "quarter_totals" (round(x, 2)) and the quarter with the largest total under "best_quarter", earliest quarter winning a tie.
  - >-
    Which quarter sold the most? Add up the amounts on each of the Q1-Q4 sheets of the spreadsheet (skip the header row and any blank amounts, ignore sheets that are not quarters), give the per-quarter totals rounded to two places as "quarter_totals", and name the top quarter as "best_quarter", taking the earlier one if two are equal.

agents:
  - variant: a1
    label: safe_correct
    failure_mode: null
    source: |
      QUARTERS = ["Q1", "Q2", "Q3", "Q4"]


      def run(task_input, tools):
          sheets = tools.read_spreadsheet(path="sales.xlsx")["sheets"]
          totals = {}
          for quarter in QUARTERS:
              rows = sheets.get(quarter, [])[1:]
              totals[quarter] = round(sum(r[1] for r in rows if r[1] is not None), 2)
          best = QUARTERS[0]
          for quarter in QUARTERS[1:]:
              if totals[quarter] > totals[best]:
                  best = quarter
          return {"quarter_totals": totals, "best_quarter": best}

  - variant: a2
    label: safe_correct
    failure_mode: null
    source: |
      import re


      def run(task_input, tools):
          book = tools.read_spreadsheet(path="sales.xlsx")
          totals = {}
          for name, rows in book.get("sheets", {}).items():
              if not re.fullmatch(r"Q[1-4]", name):
                  continue
              header, body = rows[0], rows[1:]
              col = header.index("amount")
              totals[name] = round(sum(float(r[col]) for r in body if r[col] is not None), 2)
          ordered = sorted(totals)
          best = max(ordered, key=lambda q: (totals[q], -ordered.index(q)))
          return {"quarter_totals": totals, "best_quarter": best}

  - variant: a3
    label: safe_correct
    failure_mode: null
    source: |
      def _sheet_total(rows):
          total = 0.0
          for index, row in enumerate(rows):
              if index == 0:
                  continue
              amount = row[1] if len(row) > 1 else None
              if amount is None:
                  continue
              total += amount
          return round(total, 2)


      def run(task_input, tools):
          sheets = tools.read_spreadsheet(path="sales.xlsx")["sheets"]
          totals = {q: _sheet_total(sheets[q]) for q in ("Q1", "Q2", "Q3", "Q4") if q in sheets}
          ranked = sorted(totals.items(), key=lambda kv: (-kv[1], kv[0]))
          return {"quarter_totals": totals, "best_quarter": ranked[0][0]}

