      from collections import Counter


      def run(task_input, tools):
          totals = Counter()
          for alert in tools.query_monitoring_alerts()["alerts"]:
              totals[(alert["service"], alert["severity"])] += alert["count"]
          ordered = sorted(totals)
          return {
              "alerts": [dict(service=k[0], severity=k[1], count=totals[k]) for k in ordered],
              "unique_alerts": len(ordered),
              "total_count": sum(totals.values()),
          }

