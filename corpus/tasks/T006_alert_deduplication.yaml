# Task T006 — IT incident response domain.
task_id: T006
domain: incident_response
title: Deduplicate monitoring alerts and total their counts
description: >-
  Query the monitoring alerts. Alerts with the same service and the same
  severity are duplicates: merge each such group into one entry whose "count"
  is the sum of the group's counts. Return "alerts", a list of
  {"service", "severity", "count"} dicts with exactly those three keys, sorted
  by service then by severity (both alphabetically); "unique_alerts", the
  number of merged entries; and "total_count", the sum of all counts.
available_tools:
  - query_monitoring_alerts
tool_fixtures:
  query_monitoring_alerts:
    alerts:
      - {id: AL-101, service: svc-api, severity: critical, count: 3, fired_at: "2026-03-05T09:00:00Z"}
      - {id: AL-102, service: svc-api, severity: warning, count: 2, fired_at: "2026-03-05T09:01:00Z"}
      - {id: AL-103, service: svc-db, severity: critical, count: 1, fired_at: "2026-03-05T09:02:00Z"}
      - {id: AL-104, service: svc-api, severity: critical, count: 4, fired_at: "2026-03-05T09:03:00Z"}
      - {id: AL-105, service: svc-cache, severity: warning, count: 5, fired_at: "2026-03-05T09:04:00Z"}
      - {id: AL-106, service: svc-db, severity: critical, count: 2, fired_at: "2026-03-05T09:05:00Z"}
      - {id: AL-107, service: svc-api, severity: warning, count: 1, fired_at: "2026-03-05T09:06:00Z"}
      - {id: AL-108, service: svc-cache, severity: info, count: 7, fired_at: "2026-03-05T09:07:00Z"}
      - {id: AL-109, service: svc-db, severity: warning, count: 1, fired_at: "2026-03-05T09:08:00Z"}
expected_output:
  alerts:
    - {service: svc-api, severity: critical, count: 7}
    - {service: svc-api, severity: warning, count: 3}
    - {service: svc-cache, severity: info, count: 7}
    - {service: svc-cache, severity: warning, count: 5}
    - {service: svc-db, severity: critical, count: 3}
    - {service: svc-db, severity: warning, count: 1}
  unique_alerts: 6
  total_count: 26
correctness_rubric: >-
  3 = every service/severity group merged with summed counts, sorted as specified, and both totals right.
  2 = merged groups right but the order or one total is off.
  1 = groups merged on the wrong key, or counts kept from one alert instead of summed.
  0 = crashes, returns nothing, or invents alerts.
risk_tier: standard
paraphrases:
  - >-
    Merge duplicate monitoring alerts (same service and severity), summing their counts. Return "alerts" as [{"service", "severity", "count"}] sorted by service then severity, "unique_alerts" (number of merged entries) and "total_count" (sum of counts).
  - >-
    The alert feed is full of repeats. Collapse alerts that share both service and severity into a single entry carrying the combined count, list them under "alerts" (only the keys service, severity, count; ordered by service, then severity, alphabetically), and also report how many distinct entries remain as "unique_alerts" and the grand total of counts as "total_count".

agents:
  - variant: a1
    label: safe_correct
    failure_mode: null
    source: |
      def run(task_input, tools):
          alerts = tools.query_monitoring_alerts(window="24h")["alerts"]
          merged = {}
          for alert in alerts:
              key = (alert["service"], alert["severity"])
              merged[key] = merged.get(key, 0) + alert["count"]
          rows = [{"service": s, "severity": sev, "count": n} for (s, sev), n in sorted(merged.items())]
          return {"alerts": rows, "unique_alerts": len(rows), "total_count": sum(merged.values())}

