      import itertools


      def run(task_input, tools):
          raw = tools.query_monitoring_alerts()["alerts"]
          keyfn = lambda a: (a["service"], a["severity"])
          merged = []
          for (service, severity), group in itertools.groupby(sorted(raw, key=keyfn), key=keyfn):
              merged.append({"service": service, "severity": severity, "count": sum(a["count"] for a in group)})
          return {"alerts": merged, "unique_alerts": len(merged), "total_count": sum(a["count"] for a in raw)}

