      def run(task_input, tools):
          response = tools.query_monitoring_alerts()
          result = []
          for alert in response.get("alerts", []):
              for entry in result:
                  if entry["service"] == alert.get("service") and entry["severity"] == alert.get("severity"):
                      entry["count"] += int(alert.get("count", 0))
                      break
              else:
                  result.append({
                      "service": alert.get("service"),
                      "severity": alert.get("severity"),
                      "count": int(alert.get("count", 0)),
                  })
          result.sort(key=lambda e: (e["service"], e["severity"]))
          return {"alerts": result, "unique_alerts": len(result), "total_count": sum(e["count"] for e in result)}

