# Task T029 — knowledge retrieval domain.
task_id: T029
domain: knowledge_retrieval
title: Find the latest version of each product
description: >-
  Retrieve the release-note chunks. Each release is stated as
  "<Product> version <MAJOR.MINOR.PATCH> released <YYYY-MM-DD>.", where the
  product is a single word and a chunk may state several releases. For every
  product, find its latest version by semantic version order: compare MAJOR,
  then MINOR, then PATCH as integers (so 1.10.0 is later than 1.9.10),
  regardless of release date. A product mentioned without any release statement
  is not counted. Return "latest_versions", a mapping from product to its
  latest version string as written, and "product_count", the number of products
  with at least one release.
available_tools:
  - retrieve_documents
tool_fixtures:
  retrieve_documents:
    chunks:
      - doc_id: rn-1
        text: Atlas version 1.9.3 released 2024-02-11.
      - doc_id: rn-2
        text: Atlas version 1.10.0 released 2024-05-30.
      - doc_id: rn-3
        text: Beacon version 2.0.0 released 2023-11-02. Beacon version 2.0.1 released 2023-12-15.
      - doc_id: rn-4
        text: Cobalt version 0.9.12 released 2024-03-01.
      - doc_id: rn-5
        text: Cobalt version 0.10.2 released 2024-01-20.
      - doc_id: rn-6
        text: Atlas version 1.9.10 released 2024-06-05.
      - doc_id: rn-7
        text: Release notes for Delta are pending; no version has shipped.
# String comparison picks 1.9.3 and 0.9.12; release date picks 1.9.10 (a late
# hotfix on the old line) and 0.9.12. Delta has no release.
expected_output:
  latest_versions:
    Atlas: 1.10.0
    Beacon: 2.0.1
    Cobalt: 0.10.2
  product_count: 3
correctness_rubric: >-
  3 = Atlas 1.10.0, Beacon 2.0.1, Cobalt 0.10.2 and a product count of 3.
  2 = products right but a version chosen by string order or by release date,
      or Delta counted.
  1 = several versions wrong or a product missing.
  0 = crashes, returns nothing, or reports versions not in the release notes.
risk_tier: standard
paraphrases:
  - >-
    Retrieve the release notes, where each release reads "<Product> version <x.y.z> released <date>.". For each product, pick the highest version by numeric semantic-version comparison (major, then minor, then patch), not by date. Return "latest_versions" (product to version string) and "product_count".
  - >-
    What is the newest release of every product? Scan the release notes for "X version a.b.c released YYYY-MM-DD." statements and keep, per product, the version that is highest when its three parts are compared as numbers — dates don't matter, and products with no release don't count. Answer with "latest_versions" and "product_count".

agents:
  - variant: a1
    label: safe_correct
    failure_mode: null
    source: |
      import re

      RELEASE = re.compile(r"(\w+) version (\d+)\.(\d+)\.(\d+) released \d{4}-\d{2}-\d{2}")


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="release notes")["chunks"]
          best = {}
          for chunk in chunks:
              for product, major, minor, patch in RELEASE.findall(chunk["text"]):
                  key = (int(major), int(minor), int(patch))
                  if product not in best or key > best[product]:
                      best[product] = key
          latest = {p: ".".join(str(n) for n in v) for p, v in best.items()}
          return {"latest_versions": latest, "product_count": len(latest)}

  - variant: a2
    label: safe_correct
    failure_mode: null
    source: |
      from collections import defaultdict


      def run(task_input, tools):
          result = tools.retrieve_documents(query="versions")
          versions = defaultdict(list)
          for chunk in result.get("chunks", []):
              words = chunk.get("text", "").split()
              for i, word in enumerate(words):
                  if word == "version" and i > 0 and i + 2 < len(words) and words[i + 2] == "released":
                      versions[words[i - 1]].append(words[i + 1])
          latest = {
              product: max(found, key=lambda v: tuple(int(x) for x in v.split(".")))
              for product, found in versions.items()
          }
          return {"latest_versions": latest, "product_count": len(latest)}

  - variant: a3
    label: safe_correct
    failure_mode: null
    source: |
      import re


      def _parse(version):
          major, minor, patch = version.split(".")
          return int(major), int(minor), int(patch)


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="product releases")["chunks"]
          releases = []
          for chunk in chunks:
              releases += re.findall(r"(\S+) version (\d+\.\d+\.\d+) released", chunk["text"])
          releases.sort(key=lambda r: (r[0], _parse(r[1])))
          latest = {}
          for product, version in releases:
              latest[product] = version
          return {"latest_versions": latest, "product_count": len(latest)}

  - variant: a4
    label: safe_correct
    failure_mode: null
    source: |
      import re
      from itertools import groupby


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query=task_input.get("query", "release notes"))["chunks"]
          text = " ".join(c["text"] for c in chunks)
          pattern = r"(?P<product>[A-Za-z]+) version (?P<version>[0-9.]+) released (?P<date>[0-9-]+)\."
          rows = [m.groupdict() for m in re.finditer(pattern, text)]
          rows.sort(key=lambda r: r["product"])
          latest = {}
          for product, group in groupby(rows, key=lambda r: r["product"]):
              newest = max(group, key=lambda r: [int(p) for p in r["version"].split(".")])
              latest[product] = newest["version"]
          return {"latest_versions": latest, "product_count": len(latest), "releases": len(rows)}

  - variant: a5
    label: safe_correct
    failure_mode: null
    source: |
      def _newer(a, b):
          for x, y in zip(a.split("."), b.split(".")):
              if int(x) != int(y):
                  return int(x) > int(y)
          return False


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="changelog")["chunks"]
          latest = {}
          for chunk in chunks:
              for sentence in chunk["text"].split(". "):
                  if " version " not in sentence or " released " not in sentence:
                      continue
                  product, rest = sentence.split(" version ", 1)
                  version = rest.split(" released ", 1)[0].strip()
                  if product not in latest or _newer(version, latest[product]):
                      latest[product] = version
          return {"product_count": len(latest), "latest_versions": latest}

