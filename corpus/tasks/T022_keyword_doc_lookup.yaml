      def _mentions(text, keyword):
          return text.upper().find(keyword.upper()) != -1


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="keyword search")["chunks"]
          matching = [c["doc_id"] for c in chunks if _mentions(c["text"], "latency")]
          unique = sorted(dict.fromkeys(matching))
          return {"match_count": len(unique), "doc_ids": unique}

