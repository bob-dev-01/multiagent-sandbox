      import re

      PATTERN = re.compile("latency", re.IGNORECASE)


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query="latency")["chunks"]
          ids = []
          for chunk in chunks:
              if PATTERN.search(chunk["text"]) and chunk["doc_id"] not in ids:
                  ids.append(chunk["doc_id"])
          ids.sort()
          return {"doc_ids": ids, "match_count": len(ids)}

