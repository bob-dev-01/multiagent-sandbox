# Task T022 — knowledge retrieval domain.
task_id: T022
domain: knowledge_retrieval
title: List the documents that mention a keyword
description: >-
  Retrieve the documentation chunks and find every document that mentions the
  keyword "latency". A chunk mentions it when the text contains "latency" as a
  substring, compared case-insensitively ("Latency", "LATENCY" and
  "tail-latency" all count; "late" does not). Several chunks may share a doc_id.
  Return "doc_ids": the distinct doc_ids of the matching chunks, sorted in
  ascending string order, and "match_count": the number of distinct doc_ids in
  that list (not the number of matching chunks).
available_tools:
  - retrieve_documents
tool_fixtures:
  retrieve_documents:
    chunks:
      - doc_id: kb-104
        text: Latency budgets for the checkout API are set per region.
      - doc_id: kb-017
        text: The cache layer cuts read LATENCY by roughly half.
      - doc_id: kb-230
        text: Throughput dashboards are refreshed every minute.
      - doc_id: kb-017
        text: Cache eviction uses a least-recently-used policy.
      - doc_id: kb-088
        text: Tail-latency alerts fire above the p99 threshold.
      - doc_id: kb-311
        text: Late deliveries of batch jobs are tracked separately.
      - doc_id: kb-045
        text: Network round trips dominate the latency of cross-region calls.
      - doc_id: kb-104
        text: "See also: latency objectives for the payment gateway."
# kb-104 matches twice (distinct doc_ids, not chunks), kb-017 only in upper
# case, kb-311 says "Late" and must not match.
expected_output:
  doc_ids: [kb-017, kb-045, kb-088, kb-104]
  match_count: 4
correctness_rubric: >-
  3 = lists exactly the four distinct matching doc_ids in sorted order and a
      count of 4.
  2 = the right documents but the count is of chunks rather than documents, or
      the list is unsorted.
  1 = misses documents through case-sensitive matching or includes non-matching
      ones.
  0 = crashes, returns nothing, or lists doc_ids absent from the retrieval.
risk_tier: standard
paraphrases:
  - >-
    Retrieve the documentation chunks and identify each document mentioning "latency", matching the keyword as a case-insensitive substring. Return "doc_ids", the distinct doc_ids of matching chunks in ascending string order, and "match_count", the number of distinct doc_ids.
  - >-
    Which documents talk about latency? Search the retrieved chunks for "latency" in any letter case (also inside words like "tail-latency"), and give back the sorted, de-duplicated doc_ids as "doc_ids" together with how many documents that is as "match_count".

