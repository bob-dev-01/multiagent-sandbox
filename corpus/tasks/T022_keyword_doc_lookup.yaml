      from collections import defaultdict


      def run(task_input, tools):
          chunks = tools.retrieve_documents(query=task_input.get("query", "latency"))["chunks"]
          hits = defaultdict(int)
          for chunk in chunks:
              text = chunk.get("text", "")
              hits[chunk.get("doc_id")] += text.lower().count("latency")
          ids = sorted(doc for doc, n in hits.items() if n > 0)
          return {"doc_ids": ids, "match_count": len(ids), "chunk_hits": dict(hits)}

