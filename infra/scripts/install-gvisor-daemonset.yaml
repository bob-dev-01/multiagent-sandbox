# Installs gVisor (runsc) onto the AKS sandbox node pool and registers it as a
# containerd runtime handler, then exposes it as a RuntimeClass.
#
# Read this before applying it. AKS does not ship gVisor; Azure's supported
# sandboxing path is Kata (Pod Sandboxing). What follows is node customization
# on a managed control plane:
#
#   * The DaemonSet is privileged and writes to the node's containerd config.
#   * A node-image upgrade replaces the node and reverts the change, which is
#     why the cluster's autoUpgradeProfile is set to 'none' in aks.bicep.
#   * If AKS changes its containerd config layout, the patch below stops
#     matching and the RuntimeClass silently stops resolving.
#
# The L3 runner calls preflight() before every batch precisely because of that
# last point: a RuntimeClass that no longer resolves must fail loudly, never
# fall back to runc while still being recorded as L3.
#
# Fallback if this proves unstable: use runtimeClassName
# 'kata-mshv-vm-isolation' with AKS Pod Sandboxing enabled. That is supported
# natively, but it is Kata rather than gVisor and belongs in the thesis
# delimitations rather than in a quiet config change.
#
# Apply:
#   kubectl apply -f infra/scripts/install-gvisor-daemonset.yaml
#   kubectl -n kube-system rollout status ds/gvisor-installer
#   kubectl get runtimeclass gvisor

---
apiVersion: v1
kind: Namespace
metadata:
  name: agentfactory-sandbox
  labels:
    agentfactory.io/purpose: untrusted-code-execution
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Pods in the sandbox namespace get no network at all. This is the Kubernetes
# half of the containment described in architecture.md section 10 — the NSG
# covers the subnet, this covers pod-to-pod and pod-to-anything traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: agentfactory-sandbox
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # No ingress and no egress rules means everything is denied, including DNS.
  # A sandboxed agent has no reason to resolve a name.

---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  nodeSelector:
    agentfactory.io/sandbox: gvisor
  tolerations:
    - key: agentfactory.io/sandbox
      operator: Equal
      value: gvisor
      effect: NoSchedule

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gvisor-installer
  namespace: kube-system

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gvisor-installer
  namespace: kube-system
  labels:
    app: gvisor-installer
spec:
  selector:
    matchLabels:
      app: gvisor-installer
  template:
    metadata:
      labels:
        app: gvisor-installer
    spec:
      serviceAccountName: gvisor-installer
      hostPID: true
      # Only the sandbox pool. The system pool must stay stock.
      nodeSelector:
        agentfactory.io/sandbox: gvisor
      tolerations:
        - key: agentfactory.io/sandbox
          operator: Equal
          value: gvisor
          effect: NoSchedule
      initContainers:
        - name: install-runsc
          image: mcr.microsoft.com/cbl-mariner/base/core:2.0
          securityContext:
            privileged: true
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              # The Mariner core image ships without a CA bundle, tar or
              # bzip2. Install them explicitly and let a failure stop the
              # script: a silently missing tool shows up much later as a
              # confusing error halfway through the install.
              #
              # CA certificates matter beyond convenience here — this
              # downloads a binary that will execute untrusted code, so
              # reaching for curl --insecure would defeat the checksum
              # verification that follows.
              echo "installing prerequisites"
              tdnf install -y ca-certificates tar bzip2 2>&1 | tail -3
              update-ca-trust 2>/dev/null || true
              for tool in curl tar bzip2 sha512sum; do
                command -v "${tool}" >/dev/null || {
                  echo "FATAL: ${tool} is missing and could not be installed"
                  exit 1
                }
              done

              HOST_BIN=/host/usr/local/bin
              CONF=/host/etc/containerd/config.toml

              # AKS 1.35 ships containerd 2.x, whose CRI plugin path is
              # "io.containerd.cri.v1.runtime". The containerd 1.x path
              # ("io.containerd.grpc.v1.cri") is silently ignored by 2.x — the
              # config parses, containerd starts, and the runtime handler
              # simply never exists. Derive the prefix from the file instead of
              # assuming either one.
              if grep -q 'io.containerd.cri.v1.runtime' "${CONF}"; then
                PLUGIN='io.containerd.cri.v1.runtime'
              else
                PLUGIN='io.containerd.grpc.v1.cri'
              fi
              echo "containerd CRI plugin path: ${PLUGIN}"

              if [ -x "${HOST_BIN}/runsc" ]; then
                echo "runsc already present"
              else
                # gVisor no longer publishes standalone binaries — the release
                # is a single tarball holding runsc, the containerd shim, and a
                # gvisor-bin/ directory of helpers that runsc resolves relative
                # to its own location. Everything therefore lands in the same
                # directory; splitting them breaks runsc at startup.
                ARCH=$(uname -m)
                URL="https://storage.googleapis.com/gvisor/releases/release/latest/${ARCH}"
                echo "downloading gvisor.tar.bz2 for ${ARCH}"
                curl -fsSL "${URL}/gvisor.tar.bz2" -o /tmp/gvisor.tar.bz2
                curl -fsSL "${URL}/gvisor.tar.bz2.sha512" -o /tmp/gvisor.tar.bz2.sha512
                ( cd /tmp && sha512sum -c gvisor.tar.bz2.sha512 )
                echo "checksum verified; extracting"
                tar -xjf /tmp/gvisor.tar.bz2 -C "${HOST_BIN}"
                chmod 0755 "${HOST_BIN}/runsc" "${HOST_BIN}/containerd-shim-runsc-v1"
                rm -f /tmp/gvisor.tar.bz2 /tmp/gvisor.tar.bz2.sha512
              fi

              if grep -q "containerd.runtimes.runsc\]" "${CONF}"; then
                echo "runsc handler already registered"
              else
                echo "registering runsc handler"
                cat >> "${CONF}" <<TOML

              [plugins."${PLUGIN}".containerd.runtimes.runsc]
                runtime_type = "io.containerd.runsc.v1"
              TOML
                echo "restarting containerd"
                chroot /host systemctl restart containerd
                sleep 5
              fi

              # Verify rather than assume: a handler that does not resolve must
              # fail the DaemonSet, not leave L3 quietly running under runc.
              chroot /host /usr/local/bin/runsc --version
              echo "gvisor install complete"
          volumeMounts:
            - name: host
              mountPath: /host
      containers:
        # The DaemonSet has to keep a pod alive to stay scheduled, but there is
        # nothing left to do after the init container, so this just sleeps.
        - name: pause
          image: mcr.microsoft.com/oss/kubernetes/pause:3.9
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: host
          hostPath:
            path: /
            type: Directory
